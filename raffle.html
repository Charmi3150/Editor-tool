<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Raffle</title>
<meta name="theme-color" content="#F2EFE6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Gochi+Hand&family=Work+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* ===== Editor huisstijl ===== */
  :root{
    --cream:#F2EFE6; --card:#FFFDF8; --blue:#1F3FBF; --on-blue:#FFFFFF; --blue-soft:#E3E7F8;
    --ink:#15173A; --muted:#6C6F88; --hair:#D9D6CB; --danger:#C8432F;
    --f-body:'Archivo', system-ui, -apple-system, sans-serif; --f-hand:'Gochi Hand', cursive;
  }
  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; }
  body{ background:var(--cream); color:var(--ink); font-family:var(--f-body); }
  .display{font-family:var(--f-body); font-weight:800; font-stretch:72%; text-transform:uppercase; line-height:.86; letter-spacing:-.005em;}
  .hand{font-family:var(--f-hand); font-weight:400;}
  .ed-topbar{display:flex; align-items:center; gap:14px;}
  .ed-back{width:44px;height:44px;border-radius:14px;flex-shrink:0;background:var(--card);border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;text-decoration:none;}
  .ed-back svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .ed-title h1{font-size:40px; margin:0; color:var(--ink);}
  .ed-title .hand{font-size:17px; color:var(--blue); margin-top:2px;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;font-family:var(--f-body);font-weight:700;font-size:14px;padding:11px 18px;cursor:pointer;transition:transform .1s ease;white-space:nowrap;}
  .btn:not(:disabled):active{transform:scale(.97);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn-primary{background:var(--blue);color:var(--on-blue);border:1.5px solid var(--blue);}
  .btn-outline{background:transparent;color:var(--ink);border:1.5px solid var(--ink);}
  .btn-big{font-weight:800;font-stretch:80%;font-size:17px;letter-spacing:.04em;text-transform:uppercase;padding:14px 18px;}
  .btn-danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger);}
  .chip{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;border:1.5px solid var(--ink);color:var(--ink);background:transparent;cursor:pointer;}
  .chip.on{background:var(--blue);border-color:var(--blue);color:var(--on-blue);}
  .round-btn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;}
  .card{background:var(--card);border:1.5px solid var(--ink);border-radius:24px;}
  .ed-input{width:100%;background:#fff;border:1.5px solid var(--hair);border-radius:14px;padding:10px 14px;font-size:14px;color:var(--ink);outline:none;font-family:var(--f-body);}
  .ed-input:focus{border-color:var(--blue);}
  .field-label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
  input[type=color]{width:100%;height:42px;border:1.5px solid var(--hair);border-radius:12px;background:#fff;padding:3px;cursor:pointer;}
  input[type=range], input[type=checkbox]{accent-color:var(--blue);}
  details.grp{border-top:1.5px solid var(--hair);padding-top:14px;margin-top:14px;}
  details.grp > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:800;font-stretch:75%;text-transform:uppercase;font-size:20px;line-height:1;color:var(--ink);}
  details.grp > summary::-webkit-details-marker{display:none;}
  details.grp > summary::before{content:'';width:7px;height:7px;border-right:1.8px solid var(--blue);border-bottom:1.8px solid var(--blue);transform:rotate(-45deg);transition:transform .15s;margin:0 4px 0 2px;}
  details.grp[open] > summary::before{transform:rotate(45deg);}
  .muted{color:var(--muted);}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect, useCallback } = React;

/* ---------------------------------------------------------
   RAFFLE — giveaway winner picker (Editor huisstijl)
--------------------------------------------------------- */

const DEFAULT_THEME = { accent: "#1F3FBF", appBg: "#F2EFE6" };
const NEUTRAL_LINE = "#D9D6CB";
const SURFACE = "#FFFDF8";
const DUMMY_NAMES = ["voorbeeld_anne", "voorbeeld_lars", "voorbeeld_mila", "voorbeeld_finn", "voorbeeld_zoe", "voorbeeld_noah"];
const CYCLE_SPEED_LEVELS = [
  { min: 22, max: 70 },
  { min: 35, max: 130 },
  { min: 55, max: 220 },
  { min: 90, max: 380 },
  { min: 140, max: 600 },
];
const CYCLE_SPEED_LABELS = ["Zeer snel", "Snel", "Normaal", "Traag", "Zeer traag"];

const FESTIVE_CONFETTI_COLORS = ["#F94144", "#F3722C", "#F9C74F", "#90BE6D", "#43AA8B", "#4D908E", "#577590", "#F8961E", "#EF476F", "#06D6A0", "#118AB2", "#FFD166"];
const FONT_GROUPS = [
  { label: "Speels", fonts: ["Fredoka", "Baloo 2", "Pacifico", "Caveat", "Kalam"] },
  { label: "Uitgesproken", fonts: ["Alfa Slab One", "Bungee", "Anton", "Passion One", "Righteous"] },
  { label: "Elegant", fonts: ["Playfair Display", "Cormorant Garamond", "Prata", "DM Serif Display"] },
  { label: "Strak", fonts: ["Poppins", "Work Sans", "Space Grotesk", "Montserrat", "Inter", "Outfit"] },
];

function loadGoogleFont(family) {
  const id = "gf-" + family.replace(/\s+/g, "-");
  if (document.getElementById(id)) return;
  const link = document.createElement("link");
  link.id = id;
  link.rel = "stylesheet";
  link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(family)}:wght@400;500;600;700;800;900&display=swap`;
  document.head.appendChild(link);
}
function shade(hex, percent) {
  const f = parseInt(hex.slice(1), 16);
  const t = percent < 0 ? 0 : 255;
  const p = percent < 0 ? percent * -1 : percent;
  const R = f >> 16, G = (f >> 8) & 0x00ff, B = f & 0x0000ff;
  return "#" + (0x1000000 + (Math.round((t - R) * p) + R) * 0x10000 + (Math.round((t - G) * p) + G) * 0x100 + (Math.round((t - B) * p) + B)).toString(16).slice(1);
}
function getContrastText(hex) {
  const c = hex.replace("#", "");
  const r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
  const yiq = (r * 299 + g * 587 + b * 114) / 1000;
  return yiq >= 150 ? "#18181B" : "#FFFFFF";
}
function parseEntrants(raw) {
  const lines = raw.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
  const junk = new Set([
    "beantwoorden", "reply", "vind ik leuk", "like", "meer antwoorden weergeven",
    "meer antwoorden bekijken", "see translation", "vertaling bekijken", "volgen",
    "follow", "verzonden", "translated", "bewerkt", "edited", "author", "auteur",
    "geverifieerd", "verified",
  ]);
  const timeAgoRe = /^\d+\s?(u|uur|d|dag|dagen|w|week|weken|m|min|minuten|min\.|j|jaar|jr|s|sec|sec\.)\.?$/i;
  const usernameRe = /^@?[a-zA-Z0-9_.]{2,30}$/;
  const pureNumberRe = /^\d+$/;
  const found = [];
  for (const line of lines) {
    const lower = line.toLowerCase();
    if (junk.has(lower)) continue;
    if (timeAgoRe.test(line)) continue;
    const clean = line.replace(/^@/, "");
    if (usernameRe.test(line) && !pureNumberRe.test(clean)) found.push(clean);
  }
  const seen = new Map();
  for (const u of found) {
    const key = u.toLowerCase();
    if (!seen.has(key)) seen.set(key, u);
  }
  return Array.from(seen.values());
}
function easeOutQuint(t) { return 1 - Math.pow(1 - t, 5); }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function dist2(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function mid2(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
function rgbToHex(r, g, b) { return "#" + [r, g, b].map((x) => clamp(Math.round(x), 0, 255).toString(16).padStart(2, "0")).join(""); }
function extractPalette(img, count = 8) {
  const size = 60;
  const c = document.createElement("canvas");
  c.width = size; c.height = size;
  const cctx = c.getContext("2d");
  cctx.drawImage(img, 0, 0, size, size);
  let data;
  try { data = cctx.getImageData(0, 0, size, size).data; } catch (e) { return []; }
  const buckets = {};
  for (let i = 0; i < data.length; i += 4) {
    const a = data[i + 3];
    if (a < 128) continue;
    const qr = Math.round(data[i] / 24) * 24, qg = Math.round(data[i + 1] / 24) * 24, qb = Math.round(data[i + 2] / 24) * 24;
    const key = qr + "," + qg + "," + qb;
    buckets[key] = (buckets[key] || 0) + 1;
  }
  const sorted = Object.entries(buckets).sort((a, b) => b[1] - a[1]);
  const colors = [];
  for (const [key] of sorted) {
    const [r, g, b] = key.split(",").map(Number);
    colors.push(rgbToHex(r, g, b));
    if (colors.length >= count) break;
  }
  return colors;
}

function SectionLabel({ n, children }) {
  return (
    <div className="flex items-center gap-2 mb-4">
      <span className="w-7 h-7 rounded-full flex items-center justify-center text-sm font-extrabold" style={{ backgroundColor: "var(--blue)", color: "var(--on-blue)" }}>{n}</span>
      <h3 className="display" style={{ fontSize: 24, margin: 0, color: "var(--ink)" }}>{children}</h3>
    </div>
  );
}
function Field({ label, children }) {
  return (
    <div className="mb-4">
      <label className="field-label">{label}</label>
      {children}
    </div>
  );
}

function PlateEditor({ cfg, setCfg, imagePalette }) {
  return (
    <div>
      <label className="flex items-center gap-2 mb-3 text-sm font-semibold" style={{ color: "var(--ink)" }}>
        <input type="checkbox" checked={cfg.enabled} onChange={(e) => setCfg((p) => ({ ...p, enabled: e.target.checked }))} style={{ width: 18, height: 18 }} />
        Kader tonen
      </label>
      {cfg.enabled && (
        <React.Fragment>
          <div className="grid grid-cols-2 gap-3 mb-1">
            <Field label="Kleur"><input type="color" value={cfg.color} onChange={(e) => setCfg((p) => ({ ...p, color: e.target.value }))} /></Field>
            <Field label={`Dekking — ${Math.round(cfg.opacity * 100)}%`}>
              <input type="range" min="5" max="100" step="5" value={Math.round(cfg.opacity * 100)} onChange={(e) => setCfg((p) => ({ ...p, opacity: Number(e.target.value) / 100 }))} className="w-full mt-3" />
            </Field>
          </div>
          {imagePalette.length > 0 ? (
            <Field label="Uit je achtergrondfoto">
              <div className="flex flex-wrap gap-2">
                {imagePalette.map((c, i) => (
                  <button key={c + i} onClick={() => setCfg((p) => ({ ...p, color: c }))} title={c}
                    className="w-8 h-8 rounded-full"
                    style={{ backgroundColor: c, border: cfg.color.toLowerCase() === c.toLowerCase() ? "3px solid var(--blue)" : "1.5px solid rgba(21,23,58,0.2)" }} />
                ))}
              </div>
            </Field>
          ) : (
            <p className="text-xs mb-3 muted">Kies een achtergrondfoto om kleuren uit de foto voor te stellen.</p>
          )}
          <Field label={`Formaat — ${Math.round(cfg.scale * 100)}%`}>
            <input type="range" min="40" max="220" step="5" value={Math.round(cfg.scale * 100)} onChange={(e) => setCfg((p) => ({ ...p, scale: Number(e.target.value) / 100 }))} className="w-full" />
          </Field>
        </React.Fragment>
      )}
    </div>
  );
}

function App() {
  const [theme, setTheme] = useState(DEFAULT_THEME);
  const [showEntrantsModal, setShowEntrantsModal] = useState(false);

  // Entrants
  const [rawComments, setRawComments] = useState("");
  const [entrants, setEntrants] = useState([]);
  const [manualAdd, setManualAdd] = useState("");
  const [processed, setProcessed] = useState(false);

  // Stage theming
  const [giveawayName, setGiveawayName] = useState("");
  const [bgImage, setBgImage] = useState(null);
  const [bgColor, setBgColor] = useState("#FAFAFA");
  const [fontColor, setFontColor] = useState("#18181B");
  const [fontFamily, setFontFamily] = useState("Space Grotesk");
  const [winnerCount, setWinnerCount] = useState(1);
  const [cycleSpeedLevel, setCycleSpeedLevel] = useState(3);

  // Plates ("kaders") behind text — apart voor naam-tijdens-trekking en winnaar
  const [namePlate, setNamePlate] = useState({ enabled: true, color: "#000000", opacity: 0.32, scale: 1 });
  const [winnerPlate, setWinnerPlate] = useState({ enabled: true, color: "#000000", opacity: 0.32, scale: 1 });

  // Positie & grootte
  const [namePos, setNamePos] = useState({ x: 50, y: 51 });
  const [nameFontSize, setNameFontSize] = useState(96);
  const [winnerPos, setWinnerPos] = useState({ x: 50, y: 76.5 });
  const [winnerFontSize, setWinnerFontSize] = useState(84);

  // Kleuren uit achtergrondfoto + gestures op canvas
  const [imagePalette, setImagePalette] = useState([]);
  const [editTarget, setEditTarget] = useState("name"); // 'name' | 'winner'
  const [guides, setGuides] = useState({ x: null, y: null });

  // Confetti
  const [confettiType, setConfettiType] = useState("squares");
  const [confettiColorMode, setConfettiColorMode] = useState("multi");
  const [confettiColor, setConfettiColor] = useState(DEFAULT_THEME.accent);

  // Draw state
  const [pool, setPool] = useState([]);
  const [winners, setWinners] = useState([]);
  const [phase, setPhase] = useState("idle"); // idle | spinning | revealing | done
  const [warning, setWarning] = useState("");

  // Recording
  const [videoUrl, setVideoUrl] = useState(null);
  const [videoBlob, setVideoBlob] = useState(null);
  const [videoMime, setVideoMime] = useState("");
  const [canRecord, setCanRecord] = useState(true);

  const canvasRef = useRef(null);
  const stageRef = useRef(null);
  const rafRef = useRef(null);
  const recorderRef = useRef(null);
  const chunksRef = useRef([]);
  const bgImgElRef = useRef(null);
  const confettiRef = useRef([]);
  const winnersQueueRef = useRef({ target: 1, got: [] });
  const pointersRef = useRef(new Map());
  const gestureRef = useRef(null);

  useEffect(() => { loadGoogleFont(fontFamily); }, [fontFamily]);

  useEffect(() => {
    if (bgImage) {
      const img = new Image();
      img.onload = () => { bgImgElRef.current = img; setImagePalette(extractPalette(img, 8)); drawIdleFrame(); };
      img.src = bgImage;
    } else { bgImgElRef.current = null; setImagePalette([]); drawIdleFrame(); }
    // eslint-disable-next-line
  }, [bgImage]);

  useEffect(() => { drawIdleFrame();
    // eslint-disable-next-line
  }, [bgColor, fontColor, fontFamily, giveawayName, pool, winners, namePlate, winnerPlate, namePos, nameFontSize, winnerPos, winnerFontSize, editTarget, guides]);

  useEffect(() => {
    if (typeof window !== "undefined" && typeof window.MediaRecorder === "undefined") setCanRecord(false);
  }, []);

  function handleProcess() {
    setEntrants(parseEntrants(rawComments));
    setProcessed(true);
  }
  function removeEntrant(idx) { setEntrants((prev) => prev.filter((_, i) => i !== idx)); }
  function addManual() {
    const v = manualAdd.trim().replace(/^@/, "");
    if (!v) return;
    if (entrants.some((e) => e.toLowerCase() === v.toLowerCase())) { setManualAdd(""); return; }
    setEntrants((prev) => [...prev, v]);
    setManualAdd("");
  }
  function useListInTrekking() {
    setPool(entrants); setWinners([]); setPhase("idle"); setVideoUrl(null); setVideoBlob(null);
    setShowEntrantsModal(false);
  }

  const CW = 1080, CH = 1920;

  function drawBackground(ctx) {
    ctx.clearRect(0, 0, CW, CH);
    if (bgImgElRef.current) {
      const img = bgImgElRef.current;
      const scale = Math.max(CW / img.width, CH / img.height);
      const w = img.width * scale, h = img.height * scale;
      ctx.drawImage(img, (CW - w) / 2, (CH - h) / 2, w, h);
      ctx.fillStyle = "rgba(0,0,0,0.28)";
      ctx.fillRect(0, 0, CW, CH);
    } else { ctx.fillStyle = bgColor; ctx.fillRect(0, 0, CW, CH); }
  }
  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(" ");
    let line = "", lines = [];
    for (let n = 0; n < words.length; n++) {
      const testLine = line + words[n] + " ";
      if (ctx.measureText(testLine).width > maxWidth && n > 0) { lines.push(line); line = words[n] + " "; }
      else line = testLine;
    }
    lines.push(line);
    const startY = y - ((lines.length - 1) * lineHeight) / 2;
    lines.forEach((l, i) => ctx.fillText(l.trim(), x, startY + i * lineHeight));
  }
  function drawTitle(ctx) {
    if (!giveawayName.trim()) return;
    ctx.save();
    ctx.textAlign = "center";
    ctx.fillStyle = fontColor;
    ctx.font = `700 76px "${fontFamily}", sans-serif`;
    wrapText(ctx, giveawayName, CW / 2, 150, 920, 84);
    ctx.restore();
  }
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function drawPlate(ctx, cx, cy, w, h, r = 28, cfg) {
    if (!cfg.enabled) return;
    ctx.save();
    ctx.globalAlpha = cfg.opacity;
    ctx.fillStyle = cfg.color;
    const sw = w * cfg.scale, sh = h * cfg.scale;
    roundRect(ctx, cx - sw / 2, cy - sh / 2, sw, sh, r);
    ctx.fill();
    ctx.restore();
  }
  function truncateLabel(s, max = 14) { return s.length > max ? s.slice(0, max - 1) + "…" : s; }

  function drawCycleName(ctx, name, scale = 1, alpha = 1) {
    const cx = CW * (namePos.x / 100), cy = CH * (namePos.y / 100);
    ctx.save();
    ctx.globalAlpha = alpha;
    drawPlate(ctx, cx, cy, 900, 260, 32, namePlate);
    ctx.translate(cx, cy); ctx.scale(scale, scale);
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = fontColor;
    let fs = nameFontSize;
    ctx.font = `800 ${fs}px "${fontFamily}", sans-serif`;
    let label = "@" + truncateLabel(name, 18);
    while (ctx.measureText(label).width > 820 && fs > 20) { fs -= 4; ctx.font = `800 ${fs}px "${fontFamily}", sans-serif`; }
    ctx.fillText(label, 0, 8);
    ctx.restore(); ctx.globalAlpha = 1;
  }
  function drawStarPath(ctx, r) {
    const spikes = 5, step = Math.PI / spikes;
    let rot = (Math.PI / 2) * 3;
    ctx.beginPath();
    ctx.moveTo(0, -r);
    for (let i = 0; i < spikes; i++) {
      let x = Math.cos(rot) * r, y = Math.sin(rot) * r;
      ctx.lineTo(x, y); rot += step;
      x = Math.cos(rot) * (r / 2); y = Math.sin(rot) * (r / 2);
      ctx.lineTo(x, y); rot += step;
    }
    ctx.lineTo(0, -r); ctx.closePath(); ctx.fill();
  }
  function spawnConfetti() {
    const palette = confettiColorMode === "single" ? [confettiColor] : FESTIVE_CONFETTI_COLORS;
    const parts = [];
    for (let i = 0; i < 320; i++) {
      parts.push({
        x: Math.random() * CW, y: -20 - Math.random() * 900, vy: 7 + Math.random() * 10,
        vx: -4 + Math.random() * 8, size: 8 + Math.random() * 16, rot: Math.random() * Math.PI,
        vrot: -0.25 + Math.random() * 0.5, color: palette[Math.floor(Math.random() * palette.length)], shape: confettiType,
      });
    }
    confettiRef.current = parts;
  }
  function drawConfetti(ctx) {
    confettiRef.current.forEach((p) => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vrot;
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.shape === "circles") { ctx.beginPath(); ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2); ctx.fill(); }
      else if (p.shape === "stars") { drawStarPath(ctx, p.size / 2); }
      else { ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); }
      ctx.restore();
    });
    confettiRef.current = confettiRef.current.filter((p) => p.y < CH + 40);
  }
  function drawWinnerBanner(ctx, name, subtitle) {
    const cx = CW * (winnerPos.x / 100), cy = CH * (winnerPos.y / 100);
    ctx.save();
    ctx.textAlign = "center"; ctx.fillStyle = theme.accent;
    ctx.font = `700 40px "Work Sans", sans-serif`;
    ctx.fillText(subtitle, cx, cy - 110);
    drawPlate(ctx, cx, cy, 940, 220, 32, winnerPlate);
    ctx.fillStyle = fontColor;
    let fs = winnerFontSize;
    ctx.font = `800 ${fs}px "${fontFamily}", sans-serif`;
    let label = "@" + truncateLabel(name, 20);
    while (ctx.measureText(label).width > 860 && fs > 24) { fs -= 4; ctx.font = `800 ${fs}px "${fontFamily}", sans-serif`; }
    ctx.fillText(label, cx, cy + 8);
    ctx.restore();
  }

  function drawSelectionBox(ctx, target) {
    ctx.save();
    ctx.strokeStyle = theme.accent;
    ctx.setLineDash([14, 10]);
    ctx.lineWidth = 4;
    if (target === "name") {
      const cx = CW * (namePos.x / 100), cy = CH * (namePos.y / 100);
      const w = 900 * namePlate.scale + 30, h = 260 * namePlate.scale + 30;
      roundRect(ctx, cx - w / 2, cy - h / 2, w, h, 24); ctx.stroke();
    } else {
      const cx = CW * (winnerPos.x / 100), cy = CH * (winnerPos.y / 100);
      const w = 940 * winnerPlate.scale + 30, h = 220 * winnerPlate.scale + 190;
      roundRect(ctx, cx - w / 2, cy - h / 2, w, h, 24); ctx.stroke();
    }
    ctx.restore();
  }

  function drawGuides(ctx) {
    if (guides.x == null && guides.y == null) return;
    ctx.save();
    ctx.strokeStyle = "#EC4899";
    ctx.setLineDash([16, 12]);
    ctx.lineWidth = 4;
    if (guides.x != null) {
      const gx = CW * (guides.x / 100);
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, CH); ctx.stroke();
    }
    if (guides.y != null) {
      const gy = CH * (guides.y / 100);
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(CW, gy); ctx.stroke();
    }
    ctx.restore();
  }

  const drawIdleFrame = useCallback(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    drawBackground(ctx);
    drawTitle(ctx);
    const displayPool = pool.length ? pool : ["voorbeeld_account"];
    const previewWinnerName = winners.length ? winners[winners.length - 1] : (pool[0] || "voorbeeld_account");
    drawCycleName(ctx, displayPool[0], 1, pool.length ? 1 : 0.35);
    drawWinnerBanner(ctx, previewWinnerName, "🎉 WINNAAR 🎉");
    drawSelectionBox(ctx, editTarget);
    drawGuides(ctx);
    if (winners.length) {
      ctx.save(); ctx.textAlign = "center"; ctx.fillStyle = fontColor;
      ctx.font = `600 30px "Work Sans", sans-serif`;
      ctx.fillText(`🏆 ${winners.length} winnaar${winners.length > 1 ? "s" : ""} getrokken`, CW / 2, 1720);
      ctx.restore();
    }
    // eslint-disable-next-line
  }, [pool, giveawayName, bgColor, fontColor, fontFamily, winners, namePlate, winnerPlate, namePos, nameFontSize, winnerPos, winnerFontSize, editTarget, guides]);

  /* ---------------- Gestures: sleep = verplaatsen, knijp = grootte ---------------- */
  function relPos(clientX, clientY) {
    const rect = stageRef.current.getBoundingClientRect();
    return { x: clamp(((clientX - rect.left) / rect.width) * 100, 0, 100), y: clamp(((clientY - rect.top) / rect.height) * 100, 0, 100) };
  }
  function currentTargetPos() {
    return editTarget === "name" ? namePos : winnerPos;
  }
  function currentTargetSize() {
    return editTarget === "name" ? { font: nameFontSize, plateScale: namePlate.scale } : { font: winnerFontSize, plateScale: winnerPlate.scale };
  }
  function applyPos(x, y) {
    let cx = clamp(x, 8, 92), cy = clamp(y, 8, 92);
    const other = editTarget === "winner" ? namePos : winnerPos;
    const SNAP = 2.5;
    let gx = null, gy = null;
    if (Math.abs(cx - 50) < SNAP) { cx = 50; gx = 50; }
    else if (Math.abs(cx - other.x) < SNAP) { cx = other.x; gx = other.x; }
    if (Math.abs(cy - 50) < SNAP) { cy = 50; gy = 50; }
    else if (Math.abs(cy - other.y) < SNAP) { cy = other.y; gy = other.y; }
    setGuides({ x: gx, y: gy });
    if (editTarget === "name") setNamePos({ x: cx, y: cy });
    else setWinnerPos({ x: cx, y: cy });
  }
  function applyScale(factor) {
    const base = gestureRef.current.baseSize;
    if (editTarget === "name") {
      setNamePlate((p) => ({ ...p, scale: clamp(Number((base.plateScale * factor).toFixed(2)), 0.4, 2.4) }));
      setNameFontSize(clamp(Math.round(base.font * factor), 24, 160));
    } else {
      setWinnerPlate((p) => ({ ...p, scale: clamp(Number((base.plateScale * factor).toFixed(2)), 0.4, 2.4) }));
      setWinnerFontSize(clamp(Math.round(base.font * factor), 24, 160));
    }
  }
  function onStagePointerDown(e) {
    if (isBusy) return;
    e.currentTarget.setPointerCapture(e.pointerId);
    pointersRef.current.set(e.pointerId, relPos(e.clientX, e.clientY));
    if (pointersRef.current.size === 1) {
      gestureRef.current = { mode: "drag", startPos: relPos(e.clientX, e.clientY), basePos: currentTargetPos() };
    } else if (pointersRef.current.size === 2) {
      const pts = Array.from(pointersRef.current.values());
      gestureRef.current = { mode: "pinch", startDist: dist2(pts[0], pts[1]), startMid: mid2(pts[0], pts[1]), basePos: currentTargetPos(), baseSize: currentTargetSize() };
    }
  }
  function onStagePointerMove(e) {
    if (isBusy || !pointersRef.current.has(e.pointerId)) return;
    pointersRef.current.set(e.pointerId, relPos(e.clientX, e.clientY));
    const pts = Array.from(pointersRef.current.values());
    if (pts.length === 1 && gestureRef.current && gestureRef.current.mode === "drag") {
      const dx = pts[0].x - gestureRef.current.startPos.x, dy = pts[0].y - gestureRef.current.startPos.y;
      applyPos(gestureRef.current.basePos.x + dx, gestureRef.current.basePos.y + dy);
    } else if (pts.length === 2 && gestureRef.current && gestureRef.current.mode === "pinch") {
      const d = dist2(pts[0], pts[1]);
      const m = mid2(pts[0], pts[1]);
      const factor = d / (gestureRef.current.startDist || 1);
      const dx = m.x - gestureRef.current.startMid.x, dy = m.y - gestureRef.current.startMid.y;
      applyPos(gestureRef.current.basePos.x + dx, gestureRef.current.basePos.y + dy);
      applyScale(factor);
    }
  }
  function onStagePointerUp(e) {
    pointersRef.current.delete(e.pointerId);
    const pts = Array.from(pointersRef.current.values());
    if (pts.length === 1) gestureRef.current = { mode: "drag", startPos: pts[0], basePos: currentTargetPos() };
    else if (pts.length === 0) { gestureRef.current = null; setGuides({ x: null, y: null }); }
  }

  function getSupportedMime() {
    const candidates = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
    for (const c of candidates) if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) return c;
    return null;
  }
  function startRecording() {
    if (!canRecord) return;
    const canvas = canvasRef.current;
    const mime = getSupportedMime();
    if (!mime || !canvas.captureStream) { setCanRecord(false); return; }
    setVideoMime(mime.split(";")[0]);
    const stream = canvas.captureStream(30);
    const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6000000 });
    chunksRef.current = [];
    recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunksRef.current.push(e.data); };
    recorder.onstop = () => {
      const blob = new Blob(chunksRef.current, { type: mime.split(";")[0] });
      setVideoBlob(blob); setVideoUrl(URL.createObjectURL(blob));
    };
    recorder.start(); recorderRef.current = recorder;
  }
  function stopRecording() {
    if (recorderRef.current && recorderRef.current.state !== "inactive") recorderRef.current.stop();
  }

  function startTrekking() {
    if (pool.length === 0) return;
    const count = Math.min(winnerCount, pool.length);
    setWarning(count < winnerCount ? `Slechts ${pool.length} deelnemers beschikbaar — aantal winnaars aangepast.` : "");
    setWinners([]); setVideoUrl(null); setVideoBlob(null);
    winnersQueueRef.current = { target: count, got: [] };
    startRecording();
    runOneDraw(pool, false);
  }
  function startPreview() {
    if (phase === "spinning" || phase === "revealing") return;
    const previewPool = pool.length ? pool : DUMMY_NAMES;
    runOneDraw(previewPool, true);
  }
  function runOneDraw(currentPool, isPreview) {
    setPhase("spinning");
    const winnerIdx = Math.floor(Math.random() * currentPool.length);
    const winnerName = currentPool[winnerIdx];
    animateCycle(currentPool, winnerName, isPreview);
  }
  function animateCycle(currentPool, winnerName, isPreview) {
    const ctx = canvasRef.current.getContext("2d");
    const speed = CYCLE_SPEED_LEVELS[cycleSpeedLevel - 1];
    const flashCount = Math.max(14, currentPool.length + 3);
    const duration = flashCount * ((speed.min + speed.max) / 2);
    const start = performance.now();
    const shuffled = [...currentPool].sort(() => Math.random() - 0.5);
    let switchIndex = -1;
    let nextSwitchAt = 0;
    function frame(now) {
      const elapsed = now - start;
      const t = Math.min(elapsed / duration, 1);
      const eased = easeOutCubic(t);
      const interval = speed.min + eased * (speed.max - speed.min);
      if (elapsed >= nextSwitchAt) { switchIndex++; nextSwitchAt += interval; }
      const nearEnd = t > 0.93;
      const name = nearEnd ? winnerName : shuffled[Math.max(0, switchIndex) % shuffled.length];
      drawBackground(ctx); drawTitle(ctx);
      drawCycleName(ctx, name, nearEnd ? 1 + (t - 0.93) * 2 : 1, 1);
      if (t < 1) rafRef.current = requestAnimationFrame(frame);
      else revealWinner(currentPool, winnerName, isPreview);
    }
    rafRef.current = requestAnimationFrame(frame);
  }
  function revealWinner(currentPool, winnerName, isPreview) {
    setPhase("revealing");
    spawnConfetti();
    const ctx = canvasRef.current.getContext("2d");
    const revealStart = performance.now();
    const revealDuration = 2200;
    function frame(now) {
      const t = Math.min((now - revealStart) / revealDuration, 1);
      drawBackground(ctx); drawTitle(ctx);
      drawCycleName(ctx, winnerName, 1.3, 1);
      drawWinnerBanner(ctx, winnerName, isPreview ? "👁️ VOORBEELD" : "🎉 WINNAAR 🎉");
      drawConfetti(ctx);
      if (t < 1) rafRef.current = requestAnimationFrame(frame);
      else finishDraw(currentPool, winnerName, isPreview);
    }
    rafRef.current = requestAnimationFrame(frame);
  }
  function finishDraw(currentPool, winnerName, isPreview) {
    if (isPreview) {
      setTimeout(() => { setPhase("idle"); drawIdleFrame(); }, 400);
      return;
    }
    const q = winnersQueueRef.current;
    q.got.push(winnerName);
    setWinners([...q.got]);
    const remainingPool = currentPool.filter((p) => p !== winnerName);
    setPool(remainingPool);
    if (q.got.length < q.target && remainingPool.length > 0) setTimeout(() => runOneDraw(remainingPool, false), 1300);
    else { setPhase("done"); setTimeout(() => stopRecording(), 300); }
  }
  function resetTrekking() {
    cancelAnimationFrame(rafRef.current);
    setWinners([]); setPhase("idle"); setVideoUrl(null); setVideoBlob(null);
    setPool(entrants); confettiRef.current = [];
  }
  async function shareVideo() {
    if (!videoBlob) return;
    const ext = videoMime.includes("mp4") ? "mp4" : "webm";
    const file = new File([videoBlob], `trekking-${Date.now()}.${ext}`, { type: videoMime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: giveawayName || "Raffle" }); return; } catch (e) {}
    }
    const a = document.createElement("a");
    a.href = videoUrl; a.download = `trekking-${Date.now()}.${ext}`; a.click();
  }

  const isBusy = phase === "spinning" || phase === "revealing";
  const accentText = getContrastText(theme.accent);
  const themeVars = { "--blue": theme.accent, "--on-blue": accentText, "--cream": theme.appBg, backgroundColor: theme.appBg };

  return (
    <div className="min-h-screen w-full flex justify-center" style={themeVars}>
      <div className="w-full max-w-2xl pb-16">
        <div className="px-5 pt-6 pb-3 flex items-center justify-between gap-3">
          <div className="ed-topbar">
            <a className="ed-back" href="index.html" aria-label="Terug naar overzicht"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
            <div className="ed-title">
              <h1 className="display">Raffle</h1>
              <div className="hand">trek een winnaar</div>
            </div>
          </div>
          <button onClick={() => setShowEntrantsModal(true)} className="btn btn-primary shrink-0">
            Deelnemers{entrants.length > 0 ? ` (${entrants.length})` : ""}
          </button>
        </div>

        {/* ---- STICKY STAGE: blijft zichtbaar terwijl je instellingen scrolt ---- */}
        <div className="sticky top-0 z-20 px-5 pt-2 pb-3" style={{ backgroundColor: "var(--cream)", borderBottom: "1.5px solid var(--ink)" }}>
          <div className="flex gap-2 mb-2 justify-center items-center">
            <span className="text-xs font-bold muted uppercase" style={{ letterSpacing: ".1em" }}>Verplaats</span>
            <button onClick={() => setEditTarget("name")} disabled={isBusy} className={"chip" + (editTarget !== "winner" ? " on" : "")}>Naam</button>
            <button onClick={() => setEditTarget("winner")} disabled={isBusy} className={"chip" + (editTarget === "winner" ? " on" : "")}>Winnaar</button>
          </div>

          <div className="flex justify-center">
            <div ref={stageRef} onPointerDown={onStagePointerDown} onPointerMove={onStagePointerMove} onPointerUp={onStagePointerUp} onPointerCancel={onStagePointerUp}
              className="relative" style={{ width: "100%", maxWidth: 190, aspectRatio: "9 / 16", borderRadius: 18, overflow: "hidden", border: "1.5px solid var(--ink)", touchAction: "none", cursor: isBusy ? "default" : "grab" }}>
              <canvas ref={canvasRef} width={CW} height={CH} style={{ width: "100%", height: "100%", display: "block", pointerEvents: "none" }} />
            </div>
          </div>

          {warning && <p className="text-xs text-center mt-2" style={{ color: "var(--danger)" }}>{warning}</p>}
          {!canRecord && <p className="text-xs text-center mt-2" style={{ color: "var(--danger)" }}>Video-opname niet ondersteund op dit toestel — trekking werkt wel gewoon.</p>}

          <div className="flex gap-2 mt-3">
            <button onClick={startPreview} disabled={isBusy} className="btn btn-outline flex-1">Preview</button>
            <button onClick={startTrekking} disabled={isBusy || pool.length === 0} className="btn btn-primary btn-big flex-1">{isBusy ? "Bezig..." : "Start trekking"}</button>
            {(winners.length > 0 || phase === "done") && !isBusy && (
              <button onClick={resetTrekking} className="round-btn shrink-0" style={{ width: 48, height: 48 }} title="Opnieuw">↺</button>
            )}
          </div>
        </div>

        <div className="card mx-5 mt-5">
          <div className="p-5">
            {pool.length === 0 && winners.length === 0 && (
              <div className="text-center pb-5 mb-5" style={{ borderBottom: "1.5px solid var(--hair)" }}>
                <p className="text-sm mb-3 muted">Nog geen deelnemers geladen — je kan hierboven wel al stijlen en verslepen met voorbeeldnamen.</p>
                <button onClick={() => setShowEntrantsModal(true)} className="btn btn-primary">Deelnemers toevoegen</button>
              </div>
            )}
            <React.Fragment>
                {videoUrl && (
                  <div className="mb-6 p-4" style={{ backgroundColor: "var(--blue-soft)", borderRadius: 18 }}>
                    <p className="display mb-3" style={{ fontSize: 20, color: "var(--ink)" }}>Video van de trekking</p>
                    <video src={videoUrl} controls className="w-full mb-3" style={{ maxHeight: 280, borderRadius: 14, background: "var(--ink)" }} />
                    <button onClick={shareVideo} className="btn btn-primary w-full">Bewaar op telefoon</button>
                  </div>
                )}

                {winners.length > 0 && (
                  <div className="mb-6">
                    <SectionLabel n="★">Winnaars</SectionLabel>
                    <div className="space-y-2">
                      {winners.map((w, i) => (
                        <div key={w + i} className="flex items-center gap-3 px-3 py-2" style={{ backgroundColor: "#fff", border: "1.5px solid var(--blue)", borderRadius: 999 }}>
                          <span className="text-xs font-extrabold w-7 h-7 rounded-full flex items-center justify-center" style={{ backgroundColor: "var(--blue)", color: "var(--on-blue)" }}>{i + 1}</span>
                          <span className="font-semibold text-sm" style={{ color: "var(--ink)", fontFamily: `"${fontFamily}", sans-serif` }}>@{w}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                <div className="text-center mb-5">
                  <span className="inline-block text-xs font-bold px-3 py-1.5" style={{ background: "var(--blue-soft)", color: "var(--blue)", borderRadius: 999 }}>{pool.length} deelnemer{pool.length !== 1 ? "s" : ""} nog in de pot</span>
                </div>

                {/* ---- Video-stijl ---- */}
                <div className="pt-4" style={{ borderTop: "1.5px solid var(--hair)" }}>
                  <SectionLabel n="1">Video-stijl</SectionLabel>

                  <Field label="Naam van de giveaway (optioneel)">
                    <input value={giveawayName} onChange={(e) => setGiveawayName(e.target.value)} placeholder="bv. Zomer Giveaway — laat leeg voor geen titel" className="ed-input" />
                  </Field>

                  <Field label="Achtergrond">
                    <div className="flex gap-2">
                      <label className="btn btn-outline flex-1">
                        Afbeelding kiezen
                        <input type="file" accept="image/*" className="hidden" onChange={(e) => {
                          const file = e.target.files && e.target.files[0];
                          if (!file) return;
                          const reader = new FileReader();
                          reader.onload = () => setBgImage(reader.result);
                          reader.readAsDataURL(file);
                        }} />
                      </label>
                      {bgImage && <button onClick={() => setBgImage(null)} className="btn btn-danger" title="Afbeelding verwijderen">✕</button>}
                    </div>
                  </Field>

                  <div className="grid grid-cols-2 gap-3">
                    <Field label="Achtergrondkleur"><input type="color" value={bgColor} onChange={(e) => setBgColor(e.target.value)} /></Field>
                    <Field label="Tekstkleur"><input type="color" value={fontColor} onChange={(e) => setFontColor(e.target.value)} /></Field>
                  </div>

                  <Field label="Lettertype">
                    <select value={fontFamily} onChange={(e) => setFontFamily(e.target.value)} className="ed-input" style={{ fontFamily: `"${fontFamily}", sans-serif` }}>
                      {FONT_GROUPS.map((g) => (
                        <optgroup key={g.label} label={g.label}>
                          {g.fonts.map((f) => <option key={f} value={f} style={{ fontFamily: f }}>{f}</option>)}
                        </optgroup>

                  <Field label={`Snelheid van de doorloop — ${CYCLE_SPEED_LABELS[cycleSpeedLevel - 1]}`}>
                    <input type="range" min="1" max="5" step="1" value={cycleSpeedLevel} onChange={(e) => setCycleSpeedLevel(Number(e.target.value))} className="w-full" />
                    <div className="flex justify-between text-xs mt-1 muted"><span>Zeer snel</span><span>Zeer traag</span></div>
                  </Field>

                  <Field label="Aantal winnaars">
                    <div className="flex items-center gap-3">
                      <button onClick={() => setWinnerCount((c) => Math.max(1, c - 1))} className="round-btn">−</button>
                      <span className="display text-center" style={{ fontSize: 30, width: 34, color: "var(--ink)" }}>{winnerCount}</span>
                      <button onClick={() => setWinnerCount((c) => Math.min(entrants.length || 1, c + 1))} className="round-btn">+</button>
                      <span className="text-xs muted">max {entrants.length}</span>
                    </div>
                  </Field>
                </div>

                {/* ---- Confetti ---- */}
                <details className="grp">
                  <summary>Confetti</summary>
                  <div className="mt-4">
                    <Field label="Vorm">
                      <div className="flex gap-2">
                        {[{ id: "squares", label: "Vierkant" }, { id: "circles", label: "Rond" }, { id: "stars", label: "Ster" }].map((s) => (
                          <button key={s.id} onClick={() => setConfettiType(s.id)} className={"chip flex-1" + (confettiType === s.id ? " on" : "")}>{s.label}</button>
                        ))}
                      </div>
                    </Field>
                    <Field label="Kleuren">
                      <div className="flex gap-2 mb-2">
                        {[{ id: "multi", label: "Multicolor" }, { id: "single", label: "1 kleur" }].map((s) => (
                          <button key={s.id} onClick={() => setConfettiColorMode(s.id)} className={"chip flex-1" + (confettiColorMode === s.id ? " on" : "")}>{s.label}</button>
                        ))}
                      </div>
                      {confettiColorMode === "multi" ? (
                        <p className="text-xs muted">Standaard vrolijke mix van kleuren.</p>
                      ) : (
                        <input type="color" value={confettiColor} onChange={(e) => setConfettiColor(e.target.value)} />
                      )}
                    </Field>
                  </div>
                </details>

                {/* ---- Kaders achter tekst ---- */}
                <details className="grp">
                  <summary>Kaders achter tekst</summary>
                  <div className="mt-4">
                    <p className="field-label">Kader achter naam tijdens de trekking</p>
                    <PlateEditor cfg={namePlate} setCfg={setNamePlate} imagePalette={imagePalette} />
                    <p className="field-label" style={{ marginTop: 18 }}>Kader achter winnaar-tekst</p>
                    <PlateEditor cfg={winnerPlate} setCfg={setWinnerPlate} imagePalette={imagePalette} />
                  </div>
                </details>

                {/* ---- App-thema ---- */}
                <details className="grp">
                  <summary>Thema van de app</summary>
                  <div className="grid grid-cols-2 gap-3 mt-4">
                    <Field label="Accentkleur"><input type="color" value={theme.accent} onChange={(e) => setTheme((t) => ({ ...t, accent: e.target.value }))} /></Field>
                    <Field label="Achtergrond app"><input type="color" value={theme.appBg} onChange={(e) => setTheme((t) => ({ ...t, appBg: e.target.value }))} /></Field>
                  </div>
                  <button onClick={() => setTheme(DEFAULT_THEME)} className="text-xs font-semibold underline muted">Terug naar huisstijl</button>
                </details>
              </React.Fragment>
          </div>
        </div>

        <p className="hand text-center mt-5 px-5 muted" style={{ fontSize: 16 }}>video wordt lokaal opgenomen — niets wordt geüpload</p>
      </div>

      {showEntrantsModal && (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-5" style={{ backgroundColor: "rgba(21,23,58,0.5)" }} onClick={() => setShowEntrantsModal(false)}>
          <div className="w-full sm:max-w-lg max-h-[90vh] overflow-y-auto" style={{ background: "var(--card)", border: "1.5px solid var(--ink)", borderRadius: 26 }} onClick={(e) => e.stopPropagation()}>
            <div className="p-5">
              <div className="flex items-center justify-between mb-4">
                <h2 className="display" style={{ fontSize: 30, margin: 0, color: "var(--ink)" }}>Deelnemers</h2>
                <button onClick={() => setShowEntrantsModal(false)} className="round-btn" style={{ fontSize: 15 }}>✕</button>
              </div>

              <Field label="Plak de comments">
                <textarea value={rawComments} onChange={(e) => setRawComments(e.target.value)} placeholder="Plak hier alle comments die je van de post hebt gekopieerd..." className="ed-input h-36 resize-none" />
              </Field>

              <button onClick={handleProcess} disabled={!rawComments.trim()} className="btn btn-primary w-full">Verwerk comments</button>

              {processed && (
                <div className="mt-6">
                  <div className="flex items-center justify-between mb-3">
                    <span className="field-label" style={{ margin: 0 }}>Unieke deelnemers</span>
                    <span className="text-xs font-bold px-3 py-1" style={{ backgroundColor: "var(--blue)", color: "var(--on-blue)", borderRadius: 999 }}>{entrants.length} accounts</span>
                  </div>
                  {entrants.length === 0 ? (
                    <p className="text-sm italic muted">Geen accounts herkend. Voeg hieronder handmatig toe, of controleer je paste.</p>
                  ) : (
                    <div className="max-h-48 overflow-y-auto divide-y" style={{ border: "1.5px solid var(--hair)", borderRadius: 16, background: "#fff" }}>
                      {entrants.map((e, i) => (
                        <div key={e + i} className="flex items-center justify-between px-4 py-2 text-sm">
                          <span style={{ color: "var(--ink)" }}>@{e}</span>
                          <button onClick={() => removeEntrant(i)} className="muted hover:opacity-70">✕</button>
                        </div>
                      ))}
                    </div>
                  )}
                  <div className="flex gap-2 mt-3">
                    <input value={manualAdd} onChange={(e) => setManualAdd(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addManual()} placeholder="@gebruikersnaam handmatig toevoegen" className="ed-input flex-1" />
                    <button onClick={addManual} className="round-btn shrink-0" style={{ width: 44, height: 44, background: "var(--blue)", color: "var(--on-blue)", borderColor: "var(--blue)" }}>+</button>
                  </div>
                  <button onClick={useListInTrekking} disabled={entrants.length === 0} className="btn btn-primary btn-big w-full mt-5">Gebruik deze lijst ›</button>
                </div>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
