<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Carmi Editor</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#88b2b4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carmi Editor">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1e9;
    --ink:#3a3245;
    --muted:#a29c9f;
    --white:#ffffff;

    --orange:#f1b95c;
    --orange-2:#cd9d4e;
    --rose:#deaeba;
    --rose-2:#bd949e;
    --blue:#8a9fce;
    --blue-2:#7587af;
    --teal:#a0d2d4;
    --teal-2:#88b2b4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:38px 20px 60px;
  }
  .wrap{max-width:460px;margin:0 auto;}

  .brandblock{text-align:center;margin-bottom:26px;}
  h1{
    font-family:'Playfair Display', Georgia, serif;
    font-size:44px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 2px;
    letter-spacing:0.5px;
  }
  .tagline{
    font-size:13px;
    letter-spacing:4px;
    color:#b7b3c4;
    text-transform:uppercase;
    margin:0 0 14px;
    font-weight:600;
  }
  .status{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:#8f8c9e;
    background:rgba(255,255,255,0.5);
    padding:6px 14px;
    border-radius:20px;
  }
  .status .dot{
    width:8px;height:8px;border-radius:50%;
    background:#5fbf7a;
    box-shadow:0 0 0 3px rgba(95,191,122,0.2);
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:28px;
  }
  a.tile{
    text-decoration:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:10px;
    padding:26px 14px;
    border-radius:18px;
    min-height:150px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  a.tile:active{transform:scale(0.97);}
  a.tile.orange{
    background:linear-gradient(160deg, var(--orange) 0%, var(--orange-2) 100%);
    box-shadow:0 6px 16px rgba(205,157,78,0.30);
  }
  a.tile.rose{
    background:linear-gradient(160deg, var(--rose) 0%, var(--rose-2) 100%);
    box-shadow:0 6px 16px rgba(189,148,158,0.32);
  }
  a.tile.blue{
    background:linear-gradient(160deg, var(--blue) 0%, var(--blue-2) 100%);
    box-shadow:0 6px 16px rgba(117,135,175,0.32);
  }
  a.tile.teal{
    background:linear-gradient(160deg, var(--teal) 0%, var(--teal-2) 100%);
    box-shadow:0 6px 16px rgba(136,178,180,0.32);
  }
  .tile .icon{
    width:44px;height:44px;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
    background:rgba(255,255,255,0.45);
    border-radius:12px;
  }
  .tile .icon svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .tile .name{
    color:var(--ink);
    font-weight:700;
    font-size:15.5px;
    letter-spacing:0.2px;
  }
  .tile .desc{
    color:rgba(58,50,69,0.72);
    font-size:11.5px;
    line-height:1.4;
  }

  footer{
    text-align:center;
    margin-top:36px;
    font-size:11.5px;
    color:#b3b0c0;
    line-height:1.6;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="brandblock">
    <h1>Carmi</h1>
    <div class="tagline">Editor</div>
    <div class="status"><span class="dot"></span> Alle tools in één overzicht</div>
  </div>

  <div class="grid">

    <a class="tile orange" href="stikker.html">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z"/><circle cx="12" cy="13" r="4"/></svg>
      </div>
      <div class="name">Stikker</div>
      <div class="desc">Stopmotion camera &amp; sticker-overlay</div>
    </a>

    <a class="tile rose" href="kronkellijn.html">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M3 15c2-6 5-6 7 0s5 6 7 0 4-8 4-8"/></svg>
      </div>
      <div class="name">Kronkellijn</div>
      <div class="desc">Tekst op een golvende lijn, 4 slides</div>
    </a>

    <a class="tile blue" href="stack-reel.html">
      <div class="icon">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="4.5" rx="1"/><rect x="4" y="9.75" width="16" height="4.5" rx="1"/><rect x="4" y="15.5" width="16" height="4.5" rx="1"/></svg>
      </div>
      <div class="name">Stack Reel</div>
      <div class="desc">Video's boven elkaar stapelen</div>
    </a>

    <a class="tile teal" href="scrapt.html">
      <div class="icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.8"/><path d="M21 15l-5-5-9 9"/></svg>
      </div>
      <div class="name">Scrapt</div>
      <div class="desc">Post studio — collages &amp; layouts</div>
    </a>

  </div>

  <footer>Carmi · verzameling van eigen tools<br>Tik op een tegel om de tool te openen</footer>

</div>
</body>
</html>
