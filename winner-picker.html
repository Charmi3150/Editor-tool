<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Winner Picker</title>
<meta name="theme-color" content="#b79fd1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Winner Picker">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1e9;
    --ink:#3a3245;
    --muted:#a29c9f;
    --white:#ffffff;
    --purple:#b79fd1;
    --purple-2:#9884b8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:38px 20px 60px;
  }
  .wrap{max-width:460px;margin:0 auto;}

  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .back{
    width:36px;height:36px;border-radius:10px;
    background:rgba(255,255,255,0.6);
    display:flex;align-items:center;justify-content:center;
    text-decoration:none;color:var(--ink);
    flex-shrink:0;
  }
  .back svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  .brandblock{text-align:center;margin-bottom:8px;flex:1;}
  h1{
    font-family:'Playfair Display', Georgia, serif;
    font-size:32px;
    font-weight:700;
    color:var(--ink);
    margin:0;
    letter-spacing:0.3px;
  }
  .tagline{
    font-size:12px;
    letter-spacing:3px;
    color:#b7b3c4;
    text-transform:uppercase;
    margin:2px 0 0;
    font-weight:600;
  }

  .card{
    background:var(--white);
    border-radius:20px;
    padding:22px;
    margin-top:24px;
    box-shadow:0 6px 20px rgba(58,50,69,0.08);
  }
  .card label{
    display:block;
    font-size:12px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:10px;
  }
  textarea{
    width:100%;
    min-height:150px;
    resize:vertical;
    border:1.5px solid #ece5d8;
    border-radius:14px;
    padding:14px;
    font-family:inherit;
    font-size:15px;
    color:var(--ink);
    background:#fbf9f5;
    line-height:1.6;
  }
  textarea:focus{outline:none;border-color:var(--purple);}
  .hint{font-size:11.5px;color:var(--muted);margin-top:8px;}

  .count{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    color:var(--purple-2);
    font-weight:600;
    margin-top:10px;
  }

  .btn{
    width:100%;
    margin-top:18px;
    padding:16px;
    border:none;
    border-radius:16px;
    background:linear-gradient(160deg, var(--purple) 0%, var(--purple-2) 100%);
    box-shadow:0 6px 16px rgba(152,132,184,0.35);
    color:#fff;
    font-family:inherit;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.3px;
    cursor:pointer;
  }
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:0.5;}

  .stage{
    margin-top:22px;
    background:var(--white);
    border-radius:20px;
    padding:30px 20px;
    text-align:center;
    box-shadow:0 6px 20px rgba(58,50,69,0.08);
    display:none;
  }
  .stage.show{display:block;}
  .stage .eyebrow{
    font-size:11px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:700;
    margin-bottom:14px;
  }
  .roll{
    font-family:'Playfair Display', Georgia, serif;
    font-size:30px;
    font-weight:700;
    color:var(--ink);
    min-height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .roll.spinning{color:var(--muted);}
  .winner-badge{
    margin-top:16px;
    display:inline-block;
    padding:6px 16px;
    border-radius:20px;
    background:rgba(183,159,209,0.18);
    color:var(--purple-2);
    font-size:12.5px;
    font-weight:700;
    letter-spacing:0.5px;
    opacity:0;
    transition:opacity .3s ease;
  }
  .winner-badge.show{opacity:1;}

  footer{
    text-align:center;
    margin-top:36px;
    font-size:11.5px;
    color:#b3b0c0;
    line-height:1.6;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a class="back" href="index.html" aria-label="Terug naar overzicht">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="brandblock">
      <h1>Winner Picker</h1>
      <div class="tagline">Trek een winnaar</div>
    </div>
    <div style="width:36px;"></div>
  </div>

  <div class="card">
    <label for="names">Deelnemers (1 per lijn)</label>
    <textarea id="names" placeholder="An&#10;Bram&#10;Lise&#10;Noor&#10;..."></textarea>
    <div class="hint">Plak of typ elke naam op een nieuwe lijn.</div>
    <div class="count" id="count">0 deelnemers</div>
    <button class="btn" id="pickBtn">Kies winnaar</button>
  </div>

  <div class="stage" id="stage">
    <div class="eyebrow">En de winnaar is...</div>
    <div class="roll" id="roll">—</div>
    <div class="winner-badge" id="badge">🎉 Winnaar</div>
  </div>

  <footer>Editor · Winner Picker<br>Elke deelnemer maakt evenveel kans</footer>

</div>

<script>
  const textarea = document.getElementById('names');
  const countEl = document.getElementById('count');
  const pickBtn = document.getElementById('pickBtn');
  const stage = document.getElementById('stage');
  const rollEl = document.getElementById('roll');
  const badge = document.getElementById('badge');

  function getNames(){
    return textarea.value
      .split('\n')
      .map(n => n.trim())
      .filter(n => n.length > 0);
  }

  function updateCount(){
    const n = getNames().length;
    countEl.textContent = n === 1 ? '1 deelnemer' : n + ' deelnemers';
  }
  textarea.addEventListener('input', updateCount);
  updateCount();

  pickBtn.addEventListener('click', () => {
    const names = getNames();
    if(names.length === 0){
      textarea.focus();
      return;
    }
    if(names.length === 1){
      reveal(names[0], names);
      return;
    }

    pickBtn.disabled = true;
    stage.classList.add('show');
    badge.classList.remove('show');
    rollEl.classList.add('spinning');

    const winner = names[Math.floor(Math.random() * names.length)];
    const totalTicks = 18 + Math.floor(Math.random() * 6);
    let tick = 0;
    let delay = 60;

    function step(){
      const shown = names[Math.floor(Math.random() * names.length)];
      rollEl.textContent = shown;
      tick++;
      if(tick < totalTicks){
        delay = delay * 1.08;
        setTimeout(step, delay);
      } else {
        reveal(winner, names);
      }
    }
    step();
  });

  function reveal(winner, names){
    rollEl.classList.remove('spinning');
    rollEl.textContent = winner;
    stage.classList.add('show');
    badge.classList.add('show');
    pickBtn.disabled = false;
  }
</script>
</body>
</html>
