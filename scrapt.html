<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scrapt — post studio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg-app:#141317;
    --bg-panel:#1c1b21;
    --bg-panel-2:#232229;
    --bg-canvas-area:#0f0e12;
    --paper:#eae7e0;
    --line:#2e2d35;
    --line-soft:#38373f;
    --text:#f3f1ec;
    --text-dim:#9a98a3;
    --text-faint:#68666f;
    --accent:#a0d2d4;
    --accent-dim:#709394;
    --accent-soft:#232e2f;
    --ok:#7fd8a0;
    --radius:10px;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --sans: 'Space Grotesk', -apple-system, 'Inter', sans-serif;
    --body: 'Inter', -apple-system, sans-serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; overscroll-behavior:none;}
  body{
    background:var(--bg-app);
    color:var(--text);
    font-family:var(--body);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
    user-select:none;
  }

  /* ---------- Topbar ---------- */
  #topbar{
    height:52px; min-height:52px;
    display:flex; align-items:center; gap:10px;
    padding:0 12px;
    background:var(--bg-panel);
    border-bottom:1px solid var(--line);
    z-index:50;
  }
  .brand{
    font-family:var(--sans); font-weight:700; font-size:15px; letter-spacing:0.01em;
    display:flex; align-items:center; gap:7px; color:var(--text); white-space:nowrap;
  }
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent); box-shadow:0 0 10px var(--accent);}
  .brand small{font-family:var(--mono); font-weight:400; font-size:9px; color:var(--text-faint); letter-spacing:0.06em; margin-left:2px;}
  #topbar .spacer{flex:1;}
  select#formatSelect{
    background:var(--bg-panel-2); color:var(--text); border:1px solid var(--line-soft);
    border-radius:8px; padding:7px 10px; font-family:var(--mono); font-size:11px;
    outline:none;
  }
  .icon-btn{
    width:34px;height:34px; border-radius:8px; border:1px solid transparent;
    background:transparent; color:var(--text-dim); display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .icon-btn:active{background:var(--bg-panel-2);}
  .icon-btn:disabled{opacity:0.3;}
  .icon-btn svg{width:17px;height:17px;}
  .btn-primary{
    background:var(--accent); color:#1a0b06; border:none; border-radius:8px;
    padding:8px 14px; font-family:var(--sans); font-weight:600; font-size:12.5px;
    display:flex; align-items:center; gap:6px; cursor:pointer; white-space:nowrap;
  }
  .btn-primary:active{background:#e04e2f;}
  .btn-ghost{
    background:transparent; color:var(--text-dim); border:1px solid var(--line-soft); border-radius:8px;
    padding:7px 11px; font-family:var(--sans); font-weight:500; font-size:12px; cursor:pointer; white-space:nowrap;
  }

  /* ---------- Projecten modal ---------- */
  #projectsModal{
    display:none; position:fixed; inset:0; z-index:3000;
    background:rgba(10,10,12,0.6); backdrop-filter:blur(2px);
    align-items:center; justify-content:center; padding:20px;
  }
  #projectsModal.open{display:flex;}
  .projects-modal-inner{
    width:100%; max-width:380px; max-height:80vh; display:flex; flex-direction:column;
    background:var(--bg-panel); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 20px 50px rgba(0,0,0,0.4); overflow:hidden;
  }
  .projects-modal-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; border-bottom:1px solid var(--line);
  }
  .projects-modal-head h3{margin:0; font-family:var(--sans); font-size:14px; color:var(--text); font-weight:700;}
  .projects-modal-save{display:flex; gap:8px; padding:14px 16px; border-bottom:1px solid var(--line);}
  .projects-modal-save input{
    flex:1; min-width:0; background:var(--bg-canvas-area); border:1px solid var(--line-soft); color:var(--text);
    border-radius:8px; padding:8px 10px; font-family:var(--body); font-size:12.5px; outline:none;
  }
  .projects-modal-save input:focus{border-color:var(--accent);}
  .projects-status{
    padding:0 16px; font-family:var(--body); font-size:11.5px; color:var(--accent); min-height:14px;
  }
  .projects-status:empty{display:none;}
  .projects-list{padding:10px 16px 16px; overflow-y:auto;}
  .projects-empty{font-family:var(--body); font-size:12px; color:var(--text-faint); padding:6px 0;}
  .project-row{
    display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:9px;
    background:var(--bg-panel-2); border:1px solid transparent; margin-bottom:6px; cursor:pointer;
  }
  .project-row:hover{border-color:var(--accent);}
  .project-row .pname{flex:1; min-width:0; font-family:var(--body); font-size:12.5px; color:var(--text); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .project-row .pmeta{font-family:var(--mono); font-size:9.5px; color:var(--text-faint); flex-shrink:0;}
  .project-row .pdel{background:none; border:none; color:var(--text-faint); cursor:pointer; padding:3px; display:flex; flex-shrink:0;}
  .project-row .pdel svg{width:14px;height:14px;}
  .project-row .pdel:hover{color:#ff6b6b;}
  .project-row .pcloud{color:var(--accent); flex-shrink:0; display:flex;}
  .project-row .pcloud svg{width:13px;height:13px;}

  /* ---------- Main layout ---------- */
  #main{flex:1; display:flex; min-height:0; position:relative;}

  #rail{
    width:58px; min-width:58px; background:var(--bg-panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; padding:10px 0; gap:2px;
    overflow-y:auto;
  }
  .rail-btn{
    width:44px; height:48px; border-radius:10px; background:transparent; border:none; color:var(--text-dim);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    cursor:pointer; flex-shrink:0;
  }
  .rail-btn svg{width:18px;height:18px;}
  .rail-btn span{font-family:var(--mono); font-size:8px; letter-spacing:0.02em; text-transform:uppercase;}
  .rail-btn.active{background:var(--accent-soft); color:var(--accent);}
  .rail-sep{width:30px; height:1px; background:var(--line); margin:6px 0;}

  #canvasArea{
    flex:1; min-width:0; background:var(--bg-canvas-area);
    display:flex; align-items:center; justify-content:center; position:relative;
    background-image: radial-gradient(circle, #232229 1px, transparent 1px);
    background-size:18px 18px;
    overflow:auto;
  }
  #canvasWrap{position:relative; touch-action:none;}
  #canvasScaler{position:relative; box-shadow:0 20px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.04); border-radius:2px; overflow:hidden;}
  #canvas{
    position:absolute; top:0; left:0; background:var(--paper); overflow:hidden;
    transform-origin:top left;
  }
  #drawLayer{position:absolute; inset:0; z-index:900; pointer-events:none;}
  #drawLayer.active{pointer-events:auto; cursor:crosshair;}

  .el{
    position:absolute; cursor:grab;
  }
  .el.selected{outline:1.5px dashed var(--accent);}
  .el[data-type="text"]{
    outline-offset:2px; white-space:pre-wrap; word-break:break-word; line-height:1.15;
    display:flex; padding:2px;
  }
  .el[data-type="image"] img, .el[data-type="image"] .ph{width:100%; height:100%; display:block; object-fit:cover; pointer-events:none; border-radius:inherit;}
  .el[data-type="shape"] .shapebox{width:100%; height:100%; pointer-events:none;}
  .el[data-type="sticker"]{display:flex; align-items:center; justify-content:center; font-size:inherit; line-height:1;}
  .ph{
    background:repeating-conic-gradient(#dcd9d1 0% 25%, #e5e2da 0% 50%) 50%/16px 16px;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:4px;
    color:#8a877d; font-family:var(--mono); font-size:10px; text-align:center; padding:6px;
    border:1.5px dashed #b7b3a7; border-radius:inherit; pointer-events:auto; cursor:pointer;
  }
  .ph svg{width:20px;height:20px; opacity:0.6;}

  .handle{
    position:absolute; width:16px; height:16px; background:var(--accent); border:2px solid #1a0b06;
    border-radius:50%; z-index:1000; touch-action:none;
  }
  .handle.rot{background:#fff; top:-32px; left:50%; transform:translateX(-50%); cursor:grab;}
  .handle.nw{top:-8px; left:-8px; cursor:nwse-resize;}
  .handle.ne{top:-8px; right:-8px; cursor:nesw-resize;}
  .handle.sw{bottom:-8px; left:-8px; cursor:nesw-resize;}
  .handle.se{bottom:-8px; right:-8px; cursor:nwse-resize;}
  .handle-wrap{position:absolute; inset:0; pointer-events:none;}
  .handle-wrap .handle{pointer-events:auto;}
  .rot-line{position:absolute; top:-32px; left:50%; width:1px; height:32px; background:var(--accent); pointer-events:none;}

  /* status readout — signature element */
  #statusReadout{
    position:absolute; bottom:10px; left:10px; background:rgba(20,19,23,0.88);
    border:1px solid var(--line-soft); border-radius:7px; padding:6px 10px;
    font-family:var(--mono); font-size:10px; color:var(--text-dim); letter-spacing:0.02em;
    display:none; gap:12px; pointer-events:none; z-index:1100; backdrop-filter:blur(4px);
  }
  #statusReadout.show{display:flex;}
  #statusReadout b{color:var(--accent); font-weight:500;}

  /* ---------- Tool panel (slide-over from rail) ---------- */
  #toolPanel{
    width:0; overflow:hidden; background:var(--bg-panel); border-right:1px solid var(--line);
    transition:width 0.16s ease; flex-shrink:0;
  }
  #toolPanel.open{width:230px;}
  #toolPanelInner{width:230px; height:100%; overflow-y:auto; padding:14px 12px;}
  .panel-title{font-family:var(--sans); font-weight:600; font-size:12.5px; margin:0 0 12px; display:flex; align-items:center; justify-content:space-between;}
  .panel-title .x{color:var(--text-faint); cursor:pointer; font-size:16px; line-height:1;}
  .field-label{font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); margin:14px 0 7px;}
  .field-label:first-child{margin-top:0;}
  .grid-swatch{display:grid; grid-template-columns:repeat(6,1fr); gap:6px;}
  .swatch{width:100%; aspect-ratio:1; border-radius:6px; border:1.5px solid rgba(255,255,255,0.12); cursor:pointer;}
  .swatch.active{outline:2px solid var(--accent); outline-offset:1px;}
  .opt-btn{
    background:var(--bg-panel-2); border:1px solid var(--line-soft); color:var(--text);
    border-radius:8px; padding:9px 8px; font-size:11.5px; font-family:var(--body); cursor:pointer;
    text-align:center;
  }
  .opt-btn.active{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}
  .opt-grid2{display:grid; grid-template-columns:1fr 1fr; gap:7px;}
  .opt-grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px;}
  .full-btn{
    width:100%; background:var(--bg-panel-2); border:1px solid var(--line-soft); color:var(--text);
    border-radius:8px; padding:10px; font-family:var(--sans); font-weight:500; font-size:12px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:7px; margin-top:4px;
  }
  input[type="range"]{width:100%; accent-color:var(--accent); height:20px;}
  .emoji-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:2px;}
  .emoji-grid button{background:none; border:none; font-size:19px; padding:6px 0; border-radius:6px; cursor:pointer;}
  .emoji-grid button:active{background:var(--bg-panel-2);}
  .font-opt{
    width:100%; text-align:left; background:var(--bg-panel-2); border:1px solid var(--line-soft); color:var(--text);
    border-radius:8px; padding:10px 11px; font-size:14px; cursor:pointer; margin-bottom:6px;
  }
  .font-opt.active{border-color:var(--accent); color:var(--accent);}
  .hint{font-family:var(--body); font-size:11px; color:var(--text-faint); line-height:1.5; margin-top:6px;}

  /* ---------- Right panel: layers/properties ---------- */
  #rightPanel{
    width:0; overflow:hidden; background:var(--bg-panel); border-left:1px solid var(--line);
    transition:width 0.16s ease; flex-shrink:0;
  }
  #rightPanel.open{width:210px;}
  #rightPanelInner{width:210px; height:100%; overflow-y:auto; padding:14px 12px;}
  .layer-row{
    display:flex; align-items:center; gap:7px; padding:8px 8px; border-radius:8px; margin-bottom:4px;
    background:var(--bg-panel-2); border:1px solid transparent; cursor:pointer;
  }
  .layer-row.selected{border-color:var(--accent);}
  .layer-row .ico{width:14px;height:14px; flex-shrink:0; color:var(--text-dim);}
  .layer-row .lbl{flex:1; font-size:11px; font-family:var(--mono); color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .layer-row.selected .lbl{color:var(--text);}
  .layer-row button{background:none; border:none; color:var(--text-faint); cursor:pointer; padding:2px; display:flex;}
  .layer-row button svg{width:13px;height:13px;}
  .layer-row button.locked{color:var(--accent);}

  /* ---------- Bottom slide strip ---------- */
  #bottomBar{
    height:92px; min-height:92px; background:var(--bg-panel); border-top:1px solid var(--line);
    display:flex; align-items:center; gap:9px; padding:0 12px; overflow-x:auto;
  }
  .slide-thumb{
    position:relative; flex-shrink:0; width:56px; height:66px; border-radius:6px; border:1.5px solid var(--line-soft);
    background:var(--paper); cursor:pointer; overflow:hidden;
  }
  .slide-thumb.active{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
  .slide-thumb .num{
    position:absolute; top:2px; left:3px; font-family:var(--mono); font-size:8px; color:rgba(0,0,0,0.45); font-weight:600;
  }
  .slide-thumb .del{
    position:absolute; top:1px; right:1px; width:14px; height:14px; background:rgba(20,19,23,0.85); color:#fff;
    border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:9px; z-index:5;
  }
  .thumb-render{position:absolute; top:0; left:0; transform-origin:top left; pointer-events:none;}
  #addSlideBtn{
    flex-shrink:0; width:56px; height:66px; border-radius:6px; border:1.5px dashed var(--line-soft);
    background:transparent; color:var(--text-faint); display:flex; align-items:center; justify-content:center;
    font-size:20px; cursor:pointer;
  }
  .slide-count{font-family:var(--mono); font-size:9.5px; color:var(--text-faint); white-space:nowrap; padding-left:2px;}

  #fileInputHidden, #slotFileInputHidden, #gridFileInputHidden{display:none;}

  #quickBar{
    position:absolute; display:none; gap:3px; background:rgba(20,19,23,0.94);
    border:1px solid var(--line-soft); border-radius:9px; padding:4px; z-index:1200;
    backdrop-filter:blur(4px); box-shadow:0 6px 16px rgba(0,0,0,0.35);
  }
  #quickBar.show{display:flex;}
  #quickBar button{width:27px; height:27px; background:transparent; border:none; color:var(--text-dim); display:flex; align-items:center; justify-content:center; border-radius:6px; cursor:pointer;}
  #quickBar button svg{width:14px;height:14px;}
  #quickBar button.locked{color:var(--accent);}
  #quickBar button:active{background:var(--bg-panel-2);}

  .grid-preview-btn{
    display:flex; flex-direction:column; align-items:center; gap:7px; background:var(--bg-panel-2);
    border:1px solid var(--line-soft); border-radius:8px; padding:9px; cursor:pointer; color:var(--text-dim); font-size:10.5px;
  }
  .grid-preview-btn:active{border-color:var(--accent); color:var(--accent);}
  .grid-swatch-mini{position:relative; display:block; width:100%; aspect-ratio:1/1;}

  .snap-line{position:absolute; background:var(--accent); z-index:950; pointer-events:none; box-shadow:0 0 4px rgba(160,210,212,0.7);}
  .snap-line.v{width:1px; top:0; bottom:0;}
  .snap-line.h{height:1px; left:0; right:0;}

  /* contentEditable caret color */
  [contenteditable]{outline:none;}

  /* toast */
  #toast{
    position:fixed; bottom:110px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background:var(--bg-panel-2); border:1px solid var(--line-soft); color:var(--text); font-family:var(--sans);
    font-size:12px; padding:9px 16px; border-radius:20px; z-index:5000; transition:all 0.2s ease; pointer-events:none;
    white-space:nowrap;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  ::-webkit-scrollbar{width:6px; height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line-soft); border-radius:3px;}

  @media (max-width:640px){
    #toolPanel.open{width:180px;} #toolPanelInner{width:180px;}
    #rightPanel.open{width:160px;} #rightPanelInner{width:160px;}
    .rail-btn span{display:none;}
    .rail-btn{width:40px;}
  }
</style>
</head>
<body>

<div id="topbar">
  <a href="index.html" title="Terug naar Carmi" style="display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:var(--bg-panel-2);color:var(--text-dim);text-decoration:none;font-size:15px;flex-shrink:0;">←</a>
  <div class="brand"><span class="dot"></span>Scrapt<small>STUDIO</small></div>
  <select id="formatSelect"></select>
  <div class="spacer"></div>
  <button class="icon-btn" id="undoBtn" title="Undo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 00-15-6.7L3 13"/></svg>
  </button>
  <button class="icon-btn" id="redoBtn" title="Redo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0115-6.7L21 13"/></svg>
  </button>
  <button class="btn-ghost" id="projectsToggleBtn">Projecten</button>
  <button class="btn-ghost" id="layersToggleBtn">Lagen</button>
  <button class="btn-ghost" id="exportAllBtn" style="display:none;">Alles</button>
  <button class="btn-primary" id="exportBtn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>
    Exporteer
  </button>
</div>

<div id="main">
  <div id="rail"></div>

  <div id="toolPanel"><div id="toolPanelInner"></div></div>

  <div id="canvasArea">
    <div id="canvasWrap">
      <div id="canvasScaler">
        <div id="canvas">
          <canvas id="drawLayer"></canvas>
        </div>
      </div>
      <div id="statusReadout"></div>
      <div id="quickBar"></div>
    </div>
  </div>

  <div id="rightPanel"><div id="rightPanelInner"></div></div>
</div>

<div id="bottomBar"></div>

<div id="projectsModal">
  <div class="projects-modal-inner">
    <div class="projects-modal-head">
      <h3>Projecten</h3>
      <button type="button" class="icon-btn" id="projectsModalClose" title="Sluiten">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="projects-modal-save">
      <input type="text" id="projectNameInput" placeholder="Naam van dit project…">
      <button type="button" class="btn-primary" id="saveProjectBtn">Opslaan</button>
    </div>
    <div class="projects-status" id="projectStatus"></div>
    <div class="projects-list" id="savedProjectsList"></div>
  </div>
</div>

<input type="file" id="fileInputHidden" accept="image/*">
<input type="file" id="slotFileInputHidden" accept="image/*">
<input type="file" id="gridFileInputHidden" accept="image/*" multiple>
<div id="toast"></div>

<script>
(function(){
"use strict";

/* ============ constants ============ */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => 'e' + Math.random().toString(36).slice(2,9);
const sleep = ms => new Promise(r=>setTimeout(r,ms));

const FORMATS = [
  {key:'square',    label:'Vierkant · 1:1',   w:1080, h:1080},
  {key:'portrait',  label:'Portret · 4:5',    w:1080, h:1350},
  {key:'story',     label:'Story · 9:16',     w:1080, h:1920},
  {key:'landscape', label:'Landscape · 16:9', w:1350, h:759},
];

/* ============ state ============ */
let state = {
  format:'square',
  slides:[],
  activeSlide:0,
  tool:null,
  selectedId:null,
  scale:1,
  drawColor:'#a0d2d4',
  drawSize:8,
};
let history=[], historyIdx=-1, suppressHistory=false;
let pendingImageTargetId=null;
let pendingGridSlotIds=[];
let drawing=false, lastPt=null;
let toastTimer=null;

function newSlide(){ return {id:uid(), els:[], draw:null}; }
function slide(){ return state.slides[state.activeSlide]; }
function fmt(){ return FORMATS.find(f=>f.key===state.format); }
function selEl(){ return slide().els.find(e=>e.id===state.selectedId) || null; }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }

/* ============ history ============ */
function snapshot(){ return JSON.stringify({format:state.format, slides:state.slides, activeSlide:state.activeSlide}); }
function pushHistory(){
  if(suppressHistory) return;
  history = history.slice(0, historyIdx+1);
  history.push(snapshot());
  if(history.length>60) history.shift();
  historyIdx = history.length-1;
  updateUndoRedoBtns();
}
function restoreSnapshot(s){
  const d = JSON.parse(s);
  state.format = d.format; state.slides = d.slides; state.activeSlide = d.activeSlide;
  state.selectedId = null;
  layoutScaler();
  loadDrawForActiveSlide();
  renderAll();
}
function undo(){ if(historyIdx>0){ historyIdx--; suppressHistory=true; restoreSnapshot(history[historyIdx]); suppressHistory=false; updateUndoRedoBtns(); } }
function redo(){ if(historyIdx<history.length-1){ historyIdx++; suppressHistory=true; restoreSnapshot(history[historyIdx]); suppressHistory=false; updateUndoRedoBtns(); } }
function updateUndoRedoBtns(){ $('#undoBtn').disabled = historyIdx<=0; $('#redoBtn').disabled = historyIdx>=history.length-1; }

/* ============ layout ============ */
function layoutScaler(){
  const f = fmt();
  const area = $('#canvasArea').getBoundingClientRect();
  const pad = 28;
  let maxW = Math.max(area.width - pad*2, 80);
  let maxH = Math.max(area.height - pad*2, 80);
  let h = maxH, w = h*(f.w/f.h);
  if(w>maxW){ w=maxW; h=w*(f.h/f.w); }
  $('#canvasScaler').style.width = w+'px';
  $('#canvasScaler').style.height = h+'px';
  $('#canvas').style.width = f.w+'px';
  $('#canvas').style.height = f.h+'px';
  const scale = w/f.w;
  state.scale = scale;
  $('#canvas').style.transform = 'scale('+scale+')';
  $('#drawLayer').style.width = f.w+'px';
  $('#drawLayer').style.height = f.h+'px';
}

function toReal(clientX, clientY){
  const r = $('#canvas').getBoundingClientRect();
  return { x:(clientX-r.left)/state.scale, y:(clientY-r.top)/state.scale };
}

/* ============ render ============ */
function renderAll(){
  renderCanvasEls();
  renderThumbnails();
  renderLayers();
  renderStatus();
  renderToolPanel();
  updateRailActive();
  updateExportAllVisibility();
}

function renderCanvasEls(){
  const canvas = $('#canvas');
  $$('#canvas > .el, #canvas > .handle-wrap').forEach(n=>n.remove());
  const dl = $('#drawLayer');
  const els = slide().els;
  els.forEach((el, idx)=>{
    const node = buildElNode(el, idx);
    canvas.insertBefore(node, dl);
  });
  if(state.selectedId){
    const el = els.find(e=>e.id===state.selectedId);
    if(el){
      const hw = buildHandles(el);
      canvas.insertBefore(hw, dl);
    }
  }
  renderQuickBar();
}

function renderQuickBar(){
  const el = selEl();
  const bar = $('#quickBar');
  if(!el){ bar.classList.remove('show'); return; }
  const left = Math.max(el.x*state.scale, 0);
  const top = Math.max(el.y*state.scale - 38, 2);
  bar.style.left = left+'px';
  bar.style.top = top+'px';
  bar.classList.add('show');
  bar.innerHTML =
    '<button data-qa="dup" title="Dupliceer">'+ICON_DUP+'</button>'+
    '<button data-qa="lock" title="Vergrendel" class="'+(el.locked?'locked':'')+'">'+(el.locked?ICON_LOCKED:ICON_UNLOCKED)+'</button>'+
    '<button data-qa="del" title="Verwijder">'+ICON_TRASH+'</button>';
  bar.querySelectorAll('button').forEach(b=>{
    b.addEventListener('pointerdown', e=>e.stopPropagation());
    b.addEventListener('click', e=>{
      e.stopPropagation();
      const act = b.dataset.qa;
      const idx = slide().els.findIndex(x=>x.id===el.id);
      if(idx<0) return;
      if(act==='dup') duplicateElement(el.id);
      if(act==='lock'){ slide().els[idx].locked = !slide().els[idx].locked; pushHistory(); renderAll(); }
      if(act==='del'){ removeElement(el.id); pushHistory(); renderAll(); }
    });
  });
}

function duplicateElement(id){
  const idx = slide().els.findIndex(x=>x.id===id);
  if(idx<0) return;
  const copy = JSON.parse(JSON.stringify(slide().els[idx]));
  copy.id = uid();
  copy.x += 24; copy.y += 24;
  if(copy.type==='image'){ copy.spanNext=false; copy.spanLinkId=null; copy.spanFrom=null; }
  slide().els.splice(idx+1,0,copy);
  state.selectedId = copy.id;
  pushHistory(); renderAll();
}

function removeElement(id){
  const idx = slide().els.findIndex(x=>x.id===id);
  if(idx<0) return false;
  const el = slide().els[idx];
  if(el.spanLinkId){
    state.slides.forEach(s=>{
      const i2 = s.els.findIndex(x=>x.id===el.spanLinkId);
      if(i2>-1) s.els.splice(i2,1);
    });
  }
  if(el.spanFrom){
    state.slides.forEach(s=>{
      const src = s.els.find(x=>x.id===el.spanFrom);
      if(src){ src.spanNext=false; src.spanLinkId=null; }
    });
  }
  slide().els.splice(idx,1);
  if(state.selectedId===id) state.selectedId=null;
  return true;
}

function buildElNode(el, idx){
  const d = document.createElement('div');
  d.className = 'el'+(el.id===state.selectedId?' selected':'');
  d.dataset.id = el.id;
  d.dataset.type = el.type;
  d.style.left = el.x+'px'; d.style.top = el.y+'px';
  d.style.width = el.w+'px'; d.style.height = el.h+'px';
  d.style.transform = 'rotate('+(el.rot||0)+'deg)';
  d.style.zIndex = idx+1;
  if(el.locked) d.style.cursor='default';

  if(el.type==='text'){
    d.style.fontFamily = "'"+el.font+"'";
    d.style.fontSize = el.size+'px';
    d.style.fontWeight = el.weight;
    d.style.color = el.color;
    d.style.textAlign = el.align;
    d.style.justifyContent = el.align==='center'?'center':(el.align==='right'?'flex-end':'flex-start');
    d.style.background = el.bg || 'transparent';
    d.textContent = el.text;
  } else if(el.type==='image'){
    const fc = FRAME_STYLES[el.frame||'none'] || {};
    Object.keys(fc).forEach(k=>{ d.style[k]=fc[k]; });
    if(el.src){
      const img = document.createElement('img');
      img.src = el.src;
      img.draggable = false;
      img.style.filter = el.filter||'none';
      d.appendChild(img);
    } else {
      const ph = document.createElement('div');
      ph.className='ph';
      ph.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 15l-5-5L5 19"/></svg><span>Foto</span>';
      ph.addEventListener('click', e=>{ e.stopPropagation(); openSlotPicker(el.id); });
      d.appendChild(ph);
    }
  } else if(el.type==='shape'){
    const box=document.createElement('div');
    box.className='shapebox';
    box.style.background = el.fill;
    if(el.shape==='circle') box.style.borderRadius='50%';
    else if(el.shape==='rounded') box.style.borderRadius='18%';
    else if(el.shape==='triangle') box.style.clipPath='polygon(50% 0%, 0% 100%, 100% 100%)';
    d.appendChild(box);
  } else if(el.type==='sticker'){
    d.style.display='flex'; d.style.alignItems='center'; d.style.justifyContent='center';
    d.style.fontSize = Math.min(el.w, el.h)+'px';
    d.textContent = el.char;
  }
  return d;
}

function buildHandles(el){
  const wrap = document.createElement('div');
  wrap.className='handle-wrap';
  wrap.style.left = el.x+'px'; wrap.style.top = el.y+'px';
  wrap.style.width = el.w+'px'; wrap.style.height = el.h+'px';
  wrap.style.transform = 'rotate('+(el.rot||0)+'deg)';
  wrap.style.zIndex = 999;
  wrap.dataset.id = el.id;
  if(!el.locked){
    wrap.innerHTML =
      '<div class="rot-line"></div>'+
      '<div class="handle rot" data-h="rot"></div>'+
      '<div class="handle nw" data-h="nw"></div>'+
      '<div class="handle ne" data-h="ne"></div>'+
      '<div class="handle sw" data-h="sw"></div>'+
      '<div class="handle se" data-h="se"></div>';
  }
  return wrap;
}

/* ============ selection ============ */
function selectElement(id){
  state.selectedId = id;
  if(id){
    const el = slide().els.find(x=>x.id===id);
    if(el){
      const map = {text:'text', image:'image', shape:'shape', sticker:'sticker'};
      if(map[el.type]){ state.tool = map[el.type]; $('#toolPanel').classList.add('open'); }
    }
  }
  updateRailActive();
  renderCanvasEls();
  renderLayers();
  renderStatus();
  renderToolPanel();
}

/* ============ canvas pointer interactions ============ */
function onCanvasPointerDown(e){
  if(state.tool==='draw') return;
  if(e.target.closest('.ph')) return; /* empty photo slot handles its own click to open the picker */
  const handleNode = e.target.closest('.handle');
  const elNode = e.target.closest('.el');
  if(handleNode){
    const id = handleNode.closest('.handle-wrap').dataset.id;
    const el = slide().els.find(x=>x.id===id);
    if(!el || el.locked) return;
    startHandleDrag(e, el, handleNode.dataset.h);
    return;
  }
  if(elNode){
    const id = elNode.dataset.id;
    const el = slide().els.find(x=>x.id===id);
    if(!el) return;
    selectElement(id);
    if(el.locked) return;
    startMoveDrag(e, el);
    return;
  }
  selectElement(null);
}

function getSnapTargets(excludeId){
  const f = fmt();
  const targets = {x:[0, f.w/2, f.w], y:[0, f.h/2, f.h]};
  slide().els.forEach(el=>{
    if(el.id===excludeId) return;
    targets.x.push(el.x, el.x+el.w/2, el.x+el.w);
    targets.y.push(el.y, el.y+el.h/2, el.y+el.h);
  });
  return targets;
}

function applySnap(el, targets){
  const TH = 14;
  const candX = [el.x, el.x+el.w/2, el.x+el.w];
  const candY = [el.y, el.y+el.h/2, el.y+el.h];
  let snappedX=null, snappedY=null;
  outerX:
  for(const cx of candX){
    for(const tx of targets.x){
      if(Math.abs(cx-tx)<TH){ el.x += (tx-cx); snappedX=tx; break outerX; }
    }
  }
  outerY:
  for(const cy of candY){
    for(const ty of targets.y){
      if(Math.abs(cy-ty)<TH){ el.y += (ty-cy); snappedY=ty; break outerY; }
    }
  }
  return {x:snappedX, y:snappedY};
}

function renderSnapGuides(snap){
  $$('#canvas > .snap-line').forEach(n=>n.remove());
  if(!snap) return;
  const canvas = $('#canvas');
  const dl = $('#drawLayer');
  if(snap.x!=null){
    const line = document.createElement('div');
    line.className='snap-line v';
    line.style.left = snap.x+'px';
    canvas.insertBefore(line, dl);
  }
  if(snap.y!=null){
    const line = document.createElement('div');
    line.className='snap-line h';
    line.style.top = snap.y+'px';
    canvas.insertBefore(line, dl);
  }
}
function clearSnapGuides(){ $$('#canvas > .snap-line').forEach(n=>n.remove()); }

function startMoveDrag(e, el){
  e.preventDefault();
  const start = toReal(e.clientX, e.clientY);
  const orig = {x:el.x, y:el.y};
  const targets = getSnapTargets(el.id);
  function move(ev){
    const p = toReal(ev.clientX, ev.clientY);
    el.x = orig.x + (p.x-start.x);
    el.y = orig.y + (p.y-start.y);
    const snap = applySnap(el, targets);
    renderCanvasEls(); renderStatus();
    renderSnapGuides(snap);
  }
  function up(){
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    clearSnapGuides();
    if(el.type==='image' && el.spanNext) maybeSyncSpan(el);
    pushHistory();
  }
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}

function startHandleDrag(e, el, mode){
  e.preventDefault(); e.stopPropagation();
  const start = toReal(e.clientX, e.clientY);
  const orig = {x:el.x, y:el.y, w:el.w, h:el.h};
  const cx = orig.x+orig.w/2, cy = orig.y+orig.h/2;
  function move(ev){
    const p = toReal(ev.clientX, ev.clientY);
    if(mode==='rot'){
      const ang = Math.atan2(p.y-cy, p.x-cx)*180/Math.PI + 90;
      el.rot = Math.round(ang);
    } else {
      const dx = p.x-start.x, dy = p.y-start.y;
      let nx=orig.x, ny=orig.y, nw=orig.w, nh=orig.h;
      if(mode==='se'){ nw=orig.w+dx; nh=orig.h+dy; }
      if(mode==='ne'){ nw=orig.w+dx; nh=orig.h-dy; ny=orig.y+dy; }
      if(mode==='sw'){ nw=orig.w-dx; nh=orig.h+dy; nx=orig.x+dx; }
      if(mode==='nw'){ nw=orig.w-dx; nh=orig.h-dy; nx=orig.x+dx; ny=orig.y+dy; }
      if(nw>24){ el.x=nx; el.w=nw; }
      if(nh>24){ el.y=ny; el.h=nh; }
    }
    renderCanvasEls(); renderStatus();
  }
  function up(){
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    if(el.type==='image' && el.spanNext) maybeSyncSpan(el);
    pushHistory();
  }
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}

function placeCaretAtEnd(node){
  const range=document.createRange();
  range.selectNodeContents(node);
  range.collapse(false);
  const sel=window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function onCanvasDblClick(e){
  const elNode = e.target.closest('.el[data-type="text"]');
  if(!elNode) return;
  const el = slide().els.find(x=>x.id===elNode.dataset.id);
  if(!el || el.locked) return;
  elNode.contentEditable = true;
  elNode.focus();
  placeCaretAtEnd(elNode);
  const onBlur = ()=>{
    el.text = elNode.textContent || '';
    elNode.contentEditable=false;
    elNode.removeEventListener('blur', onBlur);
    pushHistory();
    renderLayers();
  };
  elNode.addEventListener('blur', onBlur);
}

/* ============ layers panel ============ */
function renderLayers(){
  const wrap = $('#rightPanelInner');
  const els = slide().els;
  if(els.length===0){
    wrap.innerHTML = '<div class="panel-title">Lagen<span class="x" id="closeLayersX">&#10005;</span></div><div class="hint">Nog geen elementen op deze slide.</div>';
    const x = document.getElementById('closeLayersX'); if(x) x.onclick = closeRightPanel;
    return;
  }
  let rows='';
  for(let i=els.length-1;i>=0;i--){
    const el = els[i];
    const icon = LAYER_ICONS[el.type] || LAYER_ICONS.shape;
    let label = el.type==='text' ? (el.text||'Tekst') : el.type==='image'?'Afbeelding':el.type==='sticker'?('Sticker '+el.char):'Vorm';
    label = label.slice(0,18);
    rows += '<div class="layer-row '+(el.id===state.selectedId?'selected':'')+'" data-id="'+el.id+'">'+
      '<span class="ico">'+icon+'</span>'+
      '<span class="lbl">'+escapeHtml(label)+'</span>'+
      '<button data-act="up" title="Naar voren">'+ICON_UP+'</button>'+
      '<button data-act="down" title="Naar achteren">'+ICON_DOWN+'</button>'+
      '<button data-act="lock" class="'+(el.locked?'locked':'')+'" title="Vergrendel">'+(el.locked?ICON_LOCKED:ICON_UNLOCKED)+'</button>'+
      '<button data-act="del" title="Verwijder">'+ICON_TRASH+'</button>'+
    '</div>';
  }
  wrap.innerHTML = '<div class="panel-title">Lagen ('+els.length+')<span class="x" id="closeLayersX">&#10005;</span></div>'+rows;
  const x = document.getElementById('closeLayersX'); if(x) x.onclick = closeRightPanel;
  wrap.querySelectorAll('.layer-row').forEach(row=>{
    row.addEventListener('click', e=>{
      if(e.target.closest('button')) return;
      selectElement(row.dataset.id);
    });
  });
  wrap.querySelectorAll('button[data-act]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const row = btn.closest('.layer-row');
      const id = row.dataset.id;
      const idx = els.findIndex(x2=>x2.id===id);
      if(idx<0) return;
      if(btn.dataset.act==='up' && idx<els.length-1){ const t=els[idx]; els[idx]=els[idx+1]; els[idx+1]=t; }
      if(btn.dataset.act==='down' && idx>0){ const t=els[idx]; els[idx]=els[idx-1]; els[idx-1]=t; }
      if(btn.dataset.act==='lock'){ els[idx].locked = !els[idx].locked; }
      if(btn.dataset.act==='del'){ removeElement(id); }
      pushHistory();
      renderAll();
    });
  });
}

function wireToolPanelEvents(t){
  const root = $('#toolPanelInner');
  const closeX = document.getElementById('tpClose'); if(closeX) closeX.onclick = ()=> setTool(null);
  if(t==='text'){
    const btn=document.getElementById('addTextBtn'); if(btn) btn.onclick=addTextElement;

    const sizeR = document.getElementById('sizeRange');
    if(sizeR){
      sizeR.addEventListener('input', ()=>{ const el=selEl(); if(el){ el.size=parseInt(sizeR.value,10); renderCanvasEls(); }});
      sizeR.addEventListener('change', ()=>pushHistory());
    }
    root.querySelectorAll('[data-weight]').forEach(b=>b.onclick=()=>{ const el=selEl(); if(el){ el.weight=b.dataset.weight; pushHistory(); renderAll(); }});
    root.querySelectorAll('[data-align]').forEach(b=>b.onclick=()=>{ const el=selEl(); if(el){ el.align=b.dataset.align; pushHistory(); renderAll(); }});
    root.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{ const el=selEl(); if(el){ el.color=b.dataset.color; pushHistory(); renderAll(); }});
  } else if(t==='image'){
    const btn=document.getElementById('uploadImgBtn'); if(btn) btn.onclick=addImageFromUploadTool;
    const spanBtn=document.getElementById('spanToggleBtn'); if(spanBtn) spanBtn.onclick=toggleSpanNext;
  } else if(t==='shape'){
    root.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>addShapeElement(b.dataset.shape));
    root.querySelectorAll('[data-fill]').forEach(b=>b.onclick=()=>{ const el=selEl(); if(el){ el.fill=b.dataset.fill; pushHistory(); renderAll(); }});
  } else if(t==='sticker'){
    root.querySelectorAll('[data-emoji]').forEach(b=>b.onclick=()=>addSticker(b.dataset.emoji));
  } else if(t==='frame'){
    root.querySelectorAll('[data-frame]').forEach(b=>b.onclick=()=>applyFrameToSelected(b.dataset.frame));
  } else if(t==='grid'){
    root.querySelectorAll('[data-grid]').forEach(b=>b.onclick=()=>addGridTemplate(b.dataset.grid));
  } else if(t==='draw'){
    root.querySelectorAll('[data-drawcolor]').forEach(b=>b.onclick=()=>{ state.drawColor=b.dataset.drawcolor; renderToolPanel(); });
    const dr=document.getElementById('drawSizeRange'); if(dr) dr.addEventListener('input', ()=>{ state.drawSize=parseInt(dr.value,10); });
    const cb=document.getElementById('clearDrawBtn'); if(cb) cb.onclick=clearDraw;
  } else if(t==='filter'){
    root.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>applyFilterToSelected(b.dataset.filter));
  } else if(t==='bgremove'){
    const rb=document.getElementById('bgRemoveBtn'); if(rb) rb.onclick=()=>{ const th=document.getElementById('bgThreshold'); removeBackgroundSelected(th?parseInt(th.value,10):42); };
    const rs=document.getElementById('bgResetBtn'); if(rs) rs.onclick=resetBackgroundSelected;
  }
}

function centerPos(w,h){ const f=fmt(); return {x:Math.round((f.w-w)/2), y:Math.round((f.h-h)/2)}; }

function gridPreviewHTML(key){
  const cells = GRID_LAYOUTS[key] || [];
  const blocks = cells.map(c=>
    '<span style="position:absolute; left:'+(c.x*100)+'%; top:'+(c.y*100)+'%; width:'+(c.w*100)+'%; height:'+(c.h*100)+'%; background:var(--text-dim); border-radius:2px;"></span>'
  ).join('');
  return '<span class="grid-swatch-mini">'+blocks+'</span>';
}

function addTextElement(){
  const f=fmt();
  const w = Math.min(f.w*0.75, 700), h=Math.round(f.w*0.16);
  const p = centerPos(w,h);
  const el = {id:uid(), type:'text', x:p.x, y:p.y, w:w, h:h, rot:0, text:'Jouw tekst hier', font:'Space Grotesk', size:Math.round(f.w*0.065), weight:'600', color:'#141317', align:'left', bg:'transparent', locked:false};
  slide().els.push(el);
  state.selectedId = el.id;
  pushHistory(); renderAll();
}

function addShapeElement(shape){
  const f=fmt();
  const w=f.w*0.28, h=f.w*0.28;
  const p=centerPos(w,h);
  const el={id:uid(), type:'shape', x:p.x, y:p.y, w:w, h:h, rot:0, shape:shape, fill:'#a0d2d4', locked:false};
  slide().els.push(el); state.selectedId=el.id; pushHistory(); renderAll();
}

function addSticker(char){
  const f=fmt();
  const s=f.w*0.14;
  const p=centerPos(s,s);
  const el={id:uid(), type:'sticker', x:p.x, y:p.y, w:s, h:s, rot:0, char:char, locked:false};
  slide().els.push(el); state.selectedId=el.id; pushHistory(); renderAll();
}

function addImagePlaceholder(x,y,w,h){
  const el={id:uid(), type:'image', x:x, y:y, w:w, h:h, rot:0, src:null, origSrc:null, frame:'none', filter:'none', locked:false,
    spanNext:false, spanLinkId:null, spanFrom:null};
  slide().els.push(el);
  return el;
}

function ensureNextSlide(){
  if(state.activeSlide === state.slides.length-1){
    if(state.slides.length>=20){ showToast('Maximaal 20 slides bereikt'); return null; }
    const ns = newSlide();
    state.slides.splice(state.activeSlide+1, 0, ns);
    renderThumbnails();
  }
  return state.slides[state.activeSlide+1];
}

function maybeSyncSpan(el){
  if(!el || el.type!=='image') return;
  const f = fmt();
  if(el.spanNext){
    const nextSlide = ensureNextSlide();
    if(!nextSlide){ el.spanNext=false; return; }
    let link = nextSlide.els.find(x=>x.id===el.spanLinkId);
    if(!link){
      link = {id:uid(), type:'image', x:el.x-f.w, y:el.y, w:el.w, h:el.h, rot:el.rot,
        src:el.src, origSrc:el.origSrc, frame:el.frame, filter:el.filter, locked:false,
        spanNext:false, spanLinkId:null, spanFrom:el.id};
      nextSlide.els.push(link);
      el.spanLinkId = link.id;
    } else {
      link.x=el.x-f.w; link.y=el.y; link.w=el.w; link.h=el.h; link.rot=el.rot;
      link.src=el.src; link.origSrc=el.origSrc; link.frame=el.frame; link.filter=el.filter;
    }
  } else if(el.spanLinkId){
    state.slides.forEach(s=>{
      const idx = s.els.findIndex(x=>x.id===el.spanLinkId);
      if(idx>-1) s.els.splice(idx,1);
    });
    el.spanLinkId = null;
  }
}

function removeBackgroundSelected(threshold){
  const el = selEl();
  if(!el || el.type!=='image' || !el.src){ showToast('Selecteer eerst een foto'); return; }
  const img = new Image();
  img.onload = ()=>{
    const c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    const ctx = c.getContext('2d');
    ctx.drawImage(img,0,0);
    let data;
    try{ data = ctx.getImageData(0,0,c.width,c.height); }
    catch(err){ showToast('Kon achtergrond niet verwijderen'); return; }
    const d = data.data;
    const sample = (sx,sy)=>{ const i=(sy*c.width+sx)*4; return [d[i],d[i+1],d[i+2]]; };
    const corners = [sample(2,2), sample(c.width-3,2), sample(2,c.height-3), sample(c.width-3,c.height-3)];
    const avg = [0,1,2].map(k=>(corners[0][k]+corners[1][k]+corners[2][k]+corners[3][k])/4);
    for(let i=0;i<d.length;i+=4){
      const dr=d[i]-avg[0], dg=d[i+1]-avg[1], db=d[i+2]-avg[2];
      const dist = Math.sqrt(dr*dr+dg*dg+db*db);
      if(dist < threshold) d[i+3]=0;
    }
    ctx.putImageData(data,0,0);
    if(!el.origSrc) el.origSrc = el.src;
    el.src = c.toDataURL('image/png');
    if(el.spanNext) maybeSyncSpan(el);
    pushHistory(); renderAll();
    showToast('Achtergrond verwijderd');
  };
  img.onerror = ()=> showToast('Kon afbeelding niet laden');
  img.src = el.origSrc || el.src;
}
function resetBackgroundSelected(){
  const el = selEl();
  if(!el || !el.origSrc) return;
  el.src = el.origSrc;
  if(el.spanNext) maybeSyncSpan(el);
  pushHistory(); renderAll();
}

/* ============ draw tool ============ */
function setupDrawLayerEvents(){
  const dl = $('#drawLayer');
  dl.addEventListener('pointerdown', e=>{
    if(state.tool!=='draw') return;
    drawing=true;
    lastPt = toRealFromEl(dl, e.clientX, e.clientY);
    try{ dl.setPointerCapture(e.pointerId); }catch(err){}
  });
  dl.addEventListener('pointermove', e=>{
    if(!drawing || state.tool!=='draw') return;
    const p = toRealFromEl(dl, e.clientX, e.clientY);
    const ctx = dl.getContext('2d');
    ctx.strokeStyle = state.drawColor;
    ctx.lineWidth = state.drawSize;
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(lastPt.x, lastPt.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    lastPt = p;
  });
  window.addEventListener('pointerup', ()=>{
    if(drawing){
      drawing=false;
      slide().draw = dl.toDataURL('image/png');
      pushHistory();
      renderThumbnails();
    }
  });
}
function toRealFromEl(node, clientX, clientY){
  const r = node.getBoundingClientRect();
  return { x:(clientX-r.left)/state.scale, y:(clientY-r.top)/state.scale };
}
function loadDrawForActiveSlide(){
  const dl = $('#drawLayer');
  const f = fmt();
  if(dl.width!==f.w) dl.width=f.w;
  if(dl.height!==f.h) dl.height=f.h;
  const ctx = dl.getContext('2d');
  ctx.clearRect(0,0,dl.width,dl.height);
  const data = slide().draw;
  if(data){
    const img = new Image();
    img.onload = ()=> ctx.drawImage(img,0,0,dl.width,dl.height);
    img.src = data;
  }
}
function clearDraw(){
  const dl=$('#drawLayer');
  dl.getContext('2d').clearRect(0,0,dl.width,dl.height);
  slide().draw = null;
  pushHistory();
  renderThumbnails();
}

/* ============ slides ============ */
function switchSlide(idx){
  if(idx<0 || idx>=state.slides.length) return;
  state.activeSlide = idx;
  state.selectedId = null;
  loadDrawForActiveSlide();
  renderAll();
}
function addSlide(){
  if(state.slides.length>=20){ showToast('Maximaal 20 slides'); return; }
  state.slides.push(newSlide());
  state.activeSlide = state.slides.length-1;
  state.selectedId=null;
  loadDrawForActiveSlide();
  pushHistory(); renderAll();
}
function duplicateSlide(idx){
  if(state.slides.length>=20){ showToast('Maximaal 20 slides'); return; }
  const src = state.slides[idx];
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = uid();
  copy.els.forEach(el=>{ el.id = uid(); });
  state.slides.splice(idx+1,0,copy);
  state.activeSlide = idx+1;
  state.selectedId = null;
  loadDrawForActiveSlide();
  pushHistory(); renderAll();
}
function deleteSlide(idx){
  if(state.slides.length<=1){ showToast('Minimaal 1 slide vereist'); return; }
  const removed = state.slides[idx];
  removed.els.forEach(el=>{
    if(el.spanFrom){
      state.slides.forEach(s=>{
        const src = s.els.find(x=>x.id===el.spanFrom);
        if(src){ src.spanNext=false; src.spanLinkId=null; }
      });
    }
  });
  state.slides.splice(idx,1);
  if(state.activeSlide>=state.slides.length) state.activeSlide=state.slides.length-1;
  state.selectedId = null;
  loadDrawForActiveSlide();
  pushHistory(); renderAll();
}

function renderThumbInnerHTML(sl){
  let out = sl.els.map(el=>{
    let style = 'position:absolute; left:'+el.x+'px; top:'+el.y+'px; width:'+el.w+'px; height:'+el.h+'px; transform:rotate('+(el.rot||0)+'deg); overflow:hidden;';
    if(el.type==='text'){
      style += "font-family:'"+el.font+"'; font-size:"+el.size+'px; font-weight:'+el.weight+'; color:'+el.color+'; text-align:'+el.align+'; background:'+(el.bg||'transparent')+';';
      return '<div style="'+style+'">'+escapeHtml(el.text)+'</div>';
    }
    if(el.type==='image'){
      if(el.src) return '<img src="'+el.src+'" style="'+style+' object-fit:cover; filter:'+(el.filter||'none')+';">';
      return '<div style="'+style+' background:#ddd9cf;"></div>';
    }
    if(el.type==='shape'){
      let br = el.shape==='circle'?'50%':(el.shape==='rounded'?'18%':'0');
      let clip = el.shape==='triangle'?'clip-path:polygon(50% 0%,0% 100%,100% 100%);':'';
      return '<div style="'+style+' background:'+el.fill+'; border-radius:'+br+'; '+clip+'"></div>';
    }
    if(el.type==='sticker'){
      return '<div style="'+style+' font-size:'+Math.min(el.w,el.h)+'px; display:flex; align-items:center; justify-content:center;">'+el.char+'</div>';
    }
    return '';
  }).join('');
  if(sl.draw) out += '<img src="'+sl.draw+'" style="position:absolute; inset:0; width:100%; height:100%;">';
  return out;
}

function renderThumbnails(){
  const bar = $('#bottomBar');
  const f = fmt();
  const boxW=56, boxH=66;
  const scale = Math.min(boxW/f.w, boxH/f.h);
  let html = '';
  state.slides.forEach((sl, i)=>{
    html += '<div class="slide-thumb '+(i===state.activeSlide?'active':'')+'" data-idx="'+i+'">'+
      '<span class="num">'+(i+1)+'</span>'+
      (state.slides.length>1 ? '<span class="del" data-del="'+i+'">&#10005;</span>' : '')+
      '<div class="thumb-render" style="width:'+f.w+'px;height:'+f.h+'px; transform:scale('+scale+'); background:var(--paper);">'+
        renderThumbInnerHTML(sl)+
      '</div></div>';
  });
  bar.innerHTML = html;
  const addBtn = document.createElement('button');
  addBtn.id='addSlideBtn'; addBtn.textContent='+';
  addBtn.addEventListener('click', addSlide);
  bar.appendChild(addBtn);
  const countSpan = document.createElement('span');
  countSpan.className='slide-count';
  countSpan.textContent = state.slides.length+'/20';
  bar.appendChild(countSpan);

  bar.querySelectorAll('.slide-thumb').forEach(elx=>{
    elx.addEventListener('click', e=>{
      if(e.target.hasAttribute('data-del')) return;
      switchSlide(parseInt(elx.dataset.idx,10));
    });
    elx.addEventListener('dblclick', e=>{
      e.stopPropagation();
      duplicateSlide(parseInt(elx.dataset.idx,10));
    });
  });
  bar.querySelectorAll('[data-del]').forEach(x=>{
    x.addEventListener('click', e=>{ e.stopPropagation(); deleteSlide(parseInt(x.dataset.del,10)); });
  });
}

function updateExportAllVisibility(){
  $('#exportAllBtn').style.display = state.slides.length>1 ? 'inline-flex' : 'none';
}

/* ============ export ============ */
function exportOptions(){
  const f = fmt();
  return {
    backgroundColor:'#ffffff', scale:1, useCORS:true, width:f.w, height:f.h,
    onclone:(doc)=>{
      const c = doc.getElementById('canvas');
      const s = doc.getElementById('canvasScaler');
      if(c) c.style.transform = 'none';
      if(s){ s.style.overflow='visible'; s.style.width=f.w+'px'; s.style.height=f.h+'px'; }
    }
  };
}
function downloadCanvasPng(canvasNode, filename){
  const a = document.createElement('a');
  a.href = canvasNode.toDataURL('image/png');
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}

async function exportCurrentSlide(){
  if(typeof html2canvas==='undefined'){ showToast('Exportmodule niet geladen — controleer je verbinding'); return; }
  const prevSel = state.selectedId;
  state.selectedId=null; renderCanvasEls();
  await sleep(30);
  try{
    const shot = await html2canvas($('#canvas'), exportOptions());
    downloadCanvasPng(shot, 'scrapt-slide-'+(state.activeSlide+1)+'.png');
    showToast('Geëxporteerd');
  } catch(err){
    console.error(err);
    showToast('Export mislukt');
  }
  state.selectedId = prevSel; renderCanvasEls();
}

async function exportAllSlides(){
  if(typeof html2canvas==='undefined'){ showToast('Exportmodule niet geladen — controleer je verbinding'); return; }
  const originalIdx = state.activeSlide;
  const prevSel = state.selectedId;
  state.selectedId = null;
  for(let i=0;i<state.slides.length;i++){
    state.activeSlide = i;
    loadDrawForActiveSlide();
    renderCanvasEls();
    await sleep(60);
    try{
      const shot = await html2canvas($('#canvas'), exportOptions());
      downloadCanvasPng(shot, 'scrapt-slide-'+(i+1)+'.png');
      await sleep(180);
    } catch(err){ console.error(err); }
  }
  state.activeSlide = originalIdx;
  state.selectedId = prevSel;
  loadDrawForActiveSlide();
  renderAll();
  showToast('Alle slides geëxporteerd');
}

/* ============ misc ============ */
function showToast(msg){
  const t=$('#toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'), 2200);
}

function initFormatSelect(){
  const sel = $('#formatSelect');
  sel.innerHTML = FORMATS.map(f=>'<option value="'+f.key+'">'+f.label+'</option>').join('');
  sel.value = state.format;
  sel.addEventListener('change', ()=> setFormat(sel.value));
}
function setFormat(key){
  state.format = key;
  layoutScaler();
  loadDrawForActiveSlide();
  renderAll();
  pushHistory();
}

function initRail(){
  const rail = $('#rail');
  rail.innerHTML = TOOLS.map(t=>'<button class="rail-btn" data-tool="'+t.key+'">'+t.icon+'<span>'+t.label+'</span></button>').join('');
  rail.querySelectorAll('.rail-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> setTool(btn.dataset.tool));
  });
}

function init(){
  state.slides = [newSlide()];

  initFormatSelect();
  initRail();
  setupDrawLayerEvents();

  window.addEventListener('resize', layoutScaler);
  $('#canvas').addEventListener('pointerdown', onCanvasPointerDown);
  $('#canvas').addEventListener('dblclick', onCanvasDblClick);
  $('#undoBtn').addEventListener('click', undo);
  $('#redoBtn').addEventListener('click', redo);
  $('#exportBtn').addEventListener('click', exportCurrentSlide);
  $('#exportAllBtn').addEventListener('click', exportAllSlides);
  $('#layersToggleBtn').addEventListener('click', ()=>{ $('#rightPanel').classList.toggle('open'); renderLayers(); });

  $('#projectsToggleBtn').addEventListener('click', ()=>{ $('#projectsModal').classList.add('open'); renderSavedProjectsList(); });
  $('#projectsModalClose').addEventListener('click', ()=> $('#projectsModal').classList.remove('open'));
  $('#projectsModal').addEventListener('click', e=>{ if(e.target.id==='projectsModal') $('#projectsModal').classList.remove('open'); });
  $('#saveProjectBtn').addEventListener('click', ()=> saveCurrentProject($('#projectNameInput').value));
  $('#projectNameInput').addEventListener('keydown', e=>{ if(e.key==='Enter') saveCurrentProject($('#projectNameInput').value); });

  $('#fileInputHidden').addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file){ return; }
    const reader = new FileReader();
    reader.onload = ev=>{
      const src = ev.target.result;
      if(pendingImageTargetId){
        const el = slide().els.find(x=>x.id===pendingImageTargetId);
        if(el){ el.src=src; el.origSrc=src; state.selectedId = el.id; }
      } else {
        const f=fmt();
        const w=f.w*0.55, h=f.w*0.55;
        const p=centerPos(w,h);
        const el = addImagePlaceholder(p.x,p.y,w,h);
        el.src=src; el.origSrc=src;
        state.selectedId = el.id;
      }
      pendingImageTargetId=null;
      pushHistory(); renderAll();
    };
    reader.readAsDataURL(file);
    e.target.value='';
  });

  $('#gridFileInputHidden').addEventListener('change', e=>{
    const files = Array.from(e.target.files||[]);
    const slotIds = pendingGridSlotIds.slice();
    if(files.length===0 || slotIds.length===0){ e.target.value=''; return; }
    const total = Math.min(files.length, slotIds.length);
    let done=0;
    for(let i=0;i<total;i++){
      const reader = new FileReader();
      reader.onload = (function(idx){
        return function(ev){
          const elx = slide().els.find(x=>x.id===slotIds[idx]);
          if(elx){ elx.src = ev.target.result; elx.origSrc = ev.target.result; }
          done++;
          if(done===total){
            pendingGridSlotIds = [];
            pushHistory(); renderAll();
            showToast(files.length>total ? 'Grid gevuld (eerste '+total+' foto\'s gebruikt)' : 'Grid gevuld');
          }
        };
      })(i);
      reader.readAsDataURL(files[i]);
    }
    e.target.value='';
  });

  document.addEventListener('keydown', e=>{
    if(e.target && e.target.isContentEditable) return;
    if((e.key==='Delete' || e.key==='Backspace') && state.selectedId){
      e.preventDefault();
      if(removeElement(state.selectedId)){ pushHistory(); renderAll(); }
    }
  });

  layoutScaler();
  loadDrawForActiveSlide();
  renderAll();
  pushHistory();
  updateRailActive();
  showToast('Tik links op een tool om te beginnen');
}

/* ============ projecten opslaan (IndexedDB + Supabase) ============ */
const PROJECT_DB_NAME = 'ScraptProjects';
const PROJECT_STORE = 'projects';
let currentProjectId = null;
let currentProjectName = null;

function openProjectDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(PROJECT_DB_NAME, 1);
    req.onupgradeneeded = ()=>{
      req.result.createObjectStore(PROJECT_STORE, {keyPath:'id'});
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
function formatSavedAt(ts){
  const d = new Date(ts);
  const pad = n=> String(n).padStart(2,'0');
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

async function dbSaveProject(record){
  const db = await openProjectDB();
  await new Promise((resolve, reject)=>{
    const tx = db.transaction(PROJECT_STORE, 'readwrite');
    tx.objectStore(PROJECT_STORE).put(record);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
  // Ook naar Supabase wegschrijven zodat het project op al je apparaten
  // beschikbaar is. Lukt dit niet (offline, niet ingesteld,...) dan blijft
  // de lokale (IndexedDB) kopie hierboven gewoon staan.
  if (window.sb){
    try{
      const { error } = await window.sb.from('scrapt_projects').upsert({
        id: record.id, name: record.name, data: record.data, updated_at: new Date(record.savedAt).toISOString()
      });
      if (error) throw error;
    }catch(err){
      console.error('Supabase opslaan mislukt (lokaal is wel bewaard):', err);
    }
  }
}
async function dbListProjects(){
  if (window.sb){
    try{
      const { data, error } = await window.sb.from('scrapt_projects')
        .select('id, name, data, updated_at').order('updated_at', {ascending:false});
      if (error) throw error;
      return data.map(r => ({ id:r.id, name:r.name, data:r.data, savedAt: new Date(r.updated_at).getTime() }));
    }catch(err){
      console.error('Projecten ophalen uit Supabase mislukt, lokale lijst gebruikt:', err);
    }
  }
  const db = await openProjectDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(PROJECT_STORE, 'readonly');
    const req = tx.objectStore(PROJECT_STORE).getAll();
    req.onsuccess = ()=> resolve((req.result||[]).sort((a,b)=> b.savedAt - a.savedAt));
    req.onerror = ()=> reject(req.error);
  });
}
async function dbDeleteProject(id){
  const db = await openProjectDB();
  await new Promise((resolve, reject)=>{
    const tx = db.transaction(PROJECT_STORE, 'readwrite');
    tx.objectStore(PROJECT_STORE).delete(id);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
  if (window.sb){
    try{
      const { error } = await window.sb.from('scrapt_projects').delete().eq('id', id);
      if (error) throw error;
    }catch(err){
      console.error('Supabase verwijderen mislukt:', err);
    }
  }
}

async function saveCurrentProject(name){
  const statusEl = $('#projectStatus');
  name = (name||'').trim();
  if(!name){ statusEl.textContent = 'Geef eerst een naam voor dit project.'; return; }
  const record = {
    id: currentProjectId || uid(),
    name,
    data: JSON.parse(snapshot()),
    savedAt: Date.now()
  };
  try{
    await dbSaveProject(record);
    currentProjectId = record.id;
    currentProjectName = name;
    renderSavedProjectsList();
    statusEl.textContent = `"${name}" opgeslagen.`;
    showToast('Project opgeslagen');
    setTimeout(()=>{ if(statusEl.textContent===`"${name}" opgeslagen.`) statusEl.textContent=''; }, 4000);
  }catch(err){
    console.error(err);
    statusEl.textContent = 'Opslaan is mislukt: ' + (err && err.message ? err.message : err);
  }
}

async function loadProjectById(id){
  const statusEl = $('#projectStatus');
  statusEl.textContent = 'Project laden…';
  try{
    const projects = await dbListProjects();
    const record = projects.find(p=>p.id===id);
    if(!record){ statusEl.textContent = 'Project niet gevonden.'; return; }
    suppressHistory = true;
    restoreSnapshot(JSON.stringify(record.data));
    suppressHistory = false;
    history = [snapshot()]; historyIdx = 0; updateUndoRedoBtns();
    currentProjectId = record.id;
    currentProjectName = record.name;
    $('#projectNameInput').value = record.name;
    $('#projectsModal').classList.remove('open');
    statusEl.textContent = '';
    showToast(`"${record.name}" geopend`);
  }catch(err){
    console.error(err);
    statusEl.textContent = 'Er ging iets mis bij het laden.';
  }
}

async function renderSavedProjectsList(){
  const wrap = $('#savedProjectsList');
  let projects = [];
  try{ projects = await dbListProjects(); }catch(err){ console.error(err); }
  if(!projects.length){
    wrap.innerHTML = '<div class="projects-empty">Nog geen opgeslagen projecten.</div>';
    return;
  }
  wrap.innerHTML = '';
  projects.forEach(p=>{
    const row = document.createElement('div');
    row.className = 'project-row';
    row.innerHTML = `
      <span class="pname">${escapeHtml(p.name)}</span>
      <span class="pmeta">${formatSavedAt(p.savedAt)}</span>
      <button type="button" class="pdel" title="Verwijderen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
      </button>
    `;
    row.addEventListener('click', (e)=>{
      if(e.target.closest('.pdel')) return;
      loadProjectById(p.id);
    });
    row.querySelector('.pdel').addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!confirm(`"${p.name}" verwijderen?`)) return;
      await dbDeleteProject(p.id);
      renderSavedProjectsList();
    });
    wrap.appendChild(row);
  });
}

document.addEventListener('DOMContentLoaded', init);
})();
